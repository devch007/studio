<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edubull Studio · Learning Simulations by Class</title>
<meta name="description" content="Edubull Studio — pick your class, then dive into subject-wise interactive learning simulations for Early Years to Class 8.">
<meta name="theme-color" content="#eceefa">
<meta name="color-scheme" content="light only">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b5bd6'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3Eeb%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --font: 'Plus Jakarta Sans', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bg: #eceefa;
  --bg-grad-1: #e6e5fb;
  --bg-grad-2: #f3e9f6;
  --bg-grad-3: #e3ecfb;
  --surface: rgba(255,255,255,.72);
  --surface-solid: #ffffff;
  --surface-2: rgba(255,255,255,.55);
  --surface-hover: rgba(255,255,255,.95);
  --border: rgba(99,102,241,.10);
  --border-strong: rgba(99,102,241,.22);
  --text: #141633;
  --text-2: #4a4d6b;
  --text-3: #80839c;
  --brand: #5b5bd6;
  --brand-2: #7c6cf0;
  --brand-soft: rgba(91,91,214,.10);
  --brand-soft-2: rgba(91,91,214,.18);
  --accent: #f0567d;
  --ring: rgba(91,91,214,.35);
  --shadow-sm: 0 1px 2px rgba(20,22,51,.05), 0 2px 8px rgba(20,22,51,.04);
  --shadow-md: 0 4px 16px rgba(20,22,51,.07), 0 12px 32px rgba(91,91,214,.08);
  --shadow-lg: 0 24px 64px rgba(40,44,110,.14), 0 4px 16px rgba(20,22,51,.06);
  --radius-xl: 32px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --sidebar-w: 300px;
  --ease: cubic-bezier(.2,.8,.2,1);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);color:var(--text);background:var(--bg);
  min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(1200px 700px at 8% -10%, var(--bg-grad-1), transparent 60%),
    radial-gradient(900px 600px at 100% 10%, var(--bg-grad-2), transparent 60%),
    radial-gradient(900px 700px at 60% 110%, var(--bg-grad-3), transparent 60%),
    var(--bg);
  transition:background .4s var(--ease);
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:12px}
::selection{background:var(--brand-soft-2)}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-size:var(--is,24px);line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;user-select:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;transition:grid-template-columns .35s var(--ease)}
.app.collapsed{--sidebar-w:88px}

/* ---------- Sidebar ---------- */
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
  padding:22px 16px;background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--border);overflow:hidden;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px;min-height:64px}
.brand .mark{
  width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#5b5bd6,#f0567d);color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px;
  box-shadow:0 6px 16px rgba(91,91,214,.35);
}
.brand .logo{display:block;flex:1;min-width:0}
.brand .logo img{display:block;width:100%;max-width:210px;height:auto}
.brand .mark{display:none}
.collapse-btn{
  margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  color:var(--text-3);transition:all .2s var(--ease);flex:none
}
.collapse-btn:hover{background:var(--brand-soft);color:var(--brand)}
.collapse-btn svg{transition:transform .35s var(--ease)}
.collapsed .collapse-btn svg{transform:rotate(180deg)}

.side-cta{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--brand-soft),rgba(240,86,125,.08));
  border:1px solid var(--border-strong);transition:all .25s var(--ease);margin-bottom:8px;
}
.side-cta:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.side-cta .ico{--is:22px;width:40px;height:40px;border-radius:12px;background:var(--surface-solid);display:grid;place-items:center;color:var(--brand);flex:none;box-shadow:var(--shadow-sm)}
.side-cta .t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.side-cta small{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--brand)}
.side-cta b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 2px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.nav::-webkit-scrollbar{width:5px}.nav::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px}
.nav-group{margin:12px 0 4px;padding:0 10px;font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden}
.nav-item{
  width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;
  color:var(--text-2);font-weight:600;font-size:14.5px;transition:all .2s var(--ease);position:relative;text-align:left
}
.nav-item .em{--c:var(--brand);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);flex:none;transition:transform .2s var(--ease)}
.nav-item .em svg{width:17px;height:17px}
.nav-item .em .ms{font-size:17px}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .cnt{font-size:11px;font-weight:700;min-width:26px;height:22px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.nav-item:hover{background:var(--brand-soft);color:var(--text)}
.nav-item:hover .em{transform:scale(1.1) rotate(-6deg)}
.nav-item.active{background:var(--surface-solid);color:var(--brand);box-shadow:var(--shadow-sm)}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.nav-item.active .cnt{background:var(--brand);color:#fff}
.nav-item.home{margin-bottom:4px}


.collapsed .brand .logo,.collapsed .side-cta .t,.collapsed .nav-item .lbl,.collapsed .nav-item .cnt{display:none}
.collapsed .nav-group{text-indent:-9999px;height:1px;margin:10px 14px 6px;background:var(--border-strong);padding:0;border-radius:2px}
.collapsed .brand{justify-content:center;flex-direction:column;gap:10px;padding:6px 0 14px}
.collapsed .brand .mark{display:grid}
.collapsed .collapse-btn{margin:0}
.collapsed .side-cta{justify-content:center;padding:10px;margin:0 4px 8px}
.collapsed .nav-item{justify-content:center;padding:9px 0;margin:0 4px}
.collapsed .nav-item .em{width:40px;height:40px;border-radius:13px}
.collapsed .nav-item .em svg{width:20px;height:20px}
.collapsed .nav-item .em .ms{font-size:20px}
.collapsed .nav-item.active::before{display:none}
.collapsed .nav-item.active .em{background:var(--brand);color:#fff;box-shadow:0 8px 18px var(--brand-soft-2)}
.collapsed .sidebar{padding:22px 10px}

/* ---------- Main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.scrim{display:none}
.topbar{
  position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;
  padding:18px 36px;background:linear-gradient(var(--bg), transparent);
}
.topbar .eyebrow{display:flex;align-items:center;gap:8px;--is:20px;font-size:12.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-3);letter-spacing:.3px}
.crumb button{font-weight:700;color:var(--text-3);padding:4px 8px;border-radius:8px;transition:all .2s;display:flex;align-items:center;gap:5px}
.crumb button svg{width:14px;height:14px}
.crumb button .ms{font-size:14px}
.crumb button:hover{color:var(--brand);background:var(--brand-soft)}
.crumb .cur{color:var(--text);padding:4px 8px}
.search{
  margin-left:auto;display:flex;align-items:center;gap:10px;width:min(380px,100%);height:48px;padding:0 16px;
  border-radius:16px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);transition:all .25s var(--ease)
}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft-2),var(--shadow-md);background:var(--surface-solid)}
.search svg{color:var(--text-3);flex:none}
.search input{flex:1;border:0;background:none;font:inherit;font-size:14.5px;color:var(--text);outline:none;min-width:0}
.search input::placeholder{color:var(--text-3)}
.search kbd{font-family:inherit;font-size:11px;font-weight:700;color:var(--text-3);padding:3px 7px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface-2)}
.search .clear{display:none;width:24px;height:24px;border-radius:8px;display:none;place-items:center;color:var(--text-3)}
.search.has-value .clear{display:grid}.search.has-value kbd{display:none}
.search .clear:hover{background:var(--brand-soft);color:var(--brand)}
.menu-btn{display:none;width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);place-items:center;color:var(--text-2)}

.content{padding:8px 36px 60px;flex:1}
.view{display:none;animation:fade .5s var(--ease)}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============================================================
   VIEW 1 — CHOOSE CLASS
   ============================================================ */
.hero{
  position:relative;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;
  padding:22px 40px;border-radius:var(--radius-xl);overflow:hidden;min-height:0;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);backdrop-filter:blur(24px);margin-bottom:28px
}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 300px at 90% 0%,var(--brand-soft),transparent 70%)}
.hero .greet{font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hero h1{margin:4px 0 14px;font-size:clamp(30px,3.2vw,42px);font-weight:800;letter-spacing:-1.6px;line-height:1.05}
.hero h1 span{background:linear-gradient(90deg,var(--brand),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 18px;font-size:16px;color:var(--text-2);max-width:520px}
.hero .steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:999px;background:var(--surface-solid);border:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text-2);box-shadow:var(--shadow-sm)}
.step i{--c:var(--brand);width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-style:normal;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.step i .ms{font-size:18px}
.step i .ms{font-size:16px}
.step-arrow{align-self:center;color:var(--text-3);font-weight:700}

/* Isometric tile cloud */
.iso{position:relative;width:100%;max-width:360px;height:230px;margin:0 auto;display:grid;place-items:center;perspective:900px;padding-bottom:30px}
.iso-scene{position:relative;width:180px;height:180px;display:grid;grid-template-columns:repeat(3,1fr);gap:11px;transform-style:preserve-3d;
  transform:rotateX(55deg) rotateZ(-38deg) translateZ(calc(var(--ty,0) * 1px));transition:transform .5s var(--ease)}
.iso .tile{
  --c:var(--brand);position:relative;border-radius:14px;transform-style:preserve-3d;display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 75%,#000));
  box-shadow:0 8px 0 color-mix(in srgb,var(--c) 62%,#000),0 28px 36px -8px color-mix(in srgb,var(--c) 50%,transparent);
  animation:wave 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.28s)
}
.iso .tile::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 60%);transform:translateZ(1px)}
.iso .tile svg{width:26px;height:26px;transform:translateZ(2px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.iso .tile .ms{font-size:26px}
.iso .tile .ms{font-size:28px}
.iso .tile .hi{font-family:'Noto Sans Devanagari',var(--font);font-size:26px;font-weight:700;line-height:1;transform:translateZ(2px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.iso-badge{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 16px 7px 12px;border-radius:999px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-lg);
  animation:badge 4s ease-in-out infinite
}
.iso-badge b{font-size:26px;font-weight:800;letter-spacing:-1.5px;line-height:1;background:linear-gradient(90deg,var(--brand),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.iso-badge span{font-size:12.5px;font-weight:700;color:var(--text-2);white-space:nowrap}
@keyframes wave{0%,100%{transform:translateZ(0)}50%{transform:translateZ(22px)}}
@keyframes badge{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:30px 0 16px}
.section-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}
.section-head h2 .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 14%,transparent)}
.section-head h2 .dot svg{width:18px;height:18px}
.section-head h2 .dot .ms{font-size:18px}
.section-head p{margin:2px 0 0;font-size:13.5px;color:var(--text-3)}
.section-head .meta{font-size:12.5px;font-weight:700;color:var(--text-3)}

.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.class-card{
  --c:var(--brand);position:relative;display:flex;flex-direction:column;gap:0;padding:10px;border-radius:var(--radius-lg);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);text-align:left;overflow:hidden;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);
  animation:fade .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)
}
.class-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.class-card .tile{
  position:relative;height:150px;border-radius:18px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 18%,#fff),color-mix(in srgb,var(--c) 48%,#fff));
}
.class-card .tile::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.28);right:-60px;top:-70px}
.class-card .tile::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.2);left:-40px;bottom:-50px}
.class-card .ico{position:relative;z-index:1;width:92px;height:92px;border-radius:28px;display:grid;place-items:center;color:var(--c);background:rgba(255,255,255,.75);box-shadow:0 12px 24px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 #fff;transition:transform .4s var(--ease)}
.class-card .ico svg{width:48px;height:48px}
.class-card .ico .ms{font-size:48px}
.class-card:hover .ico{transform:scale(1.1) rotate(-6deg)}
.class-card .pill{position:absolute;top:10px;right:10px;z-index:1;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 10px 5px 8px;border-radius:999px;background:rgba(255,255,255,.85);color:var(--c)}
.class-card .pill svg{width:12px;height:12px}
.class-card .pill .ms{font-size:12px}
.class-card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 8px 6px}
.class-card h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.5px}
.class-card .sub{font-size:12.5px;color:var(--text-3)}
.class-card .arrow{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--brand-soft);color:var(--c);transition:all .3s var(--ease);flex:none}
.class-card:hover .arrow{background:var(--c);color:#fff;transform:translateX(4px)}

/* ============================================================
   VIEW 2 — CLASS DETAIL / SUBJECT GAMES
   ============================================================ */
.detail-head{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-bottom:26px}
.back{
  width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow-sm);color:var(--text-2);transition:all .25s var(--ease)
}
.back:hover{background:var(--brand);color:#fff;transform:translateX(-3px);box-shadow:var(--shadow-md)}
.detail-head .title .k{font-size:12.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand);display:flex;align-items:center;gap:6px}
.detail-head .title .k svg{width:15px;height:15px}
.detail-head .title .k .ms{font-size:15px}
.detail-head p svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--brand)}
.detail-head p .ms{font-size:14px;vertical-align:-2px;margin-right:5px;color:var(--brand)}
.detail-head h1{margin:2px 0 4px;font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-1.4px;line-height:1.05;display:flex;align-items:center;gap:12px}
.detail-head h1 .big{--c:var(--brand);width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:0 10px 22px color-mix(in srgb,var(--c) 40%,transparent)}
.detail-head h1 .big svg{width:28px;height:28px}
.detail-head h1 .big .ms{font-size:28px}
.detail-head p{margin:0;color:var(--text-2);font-size:14.5px}

.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px;padding:6px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);width:fit-content;max-width:100%}
.chip{
  --c:var(--brand);display:flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 8px;border-radius:14px;font-size:13.5px;font-weight:700;color:var(--text-2);
  transition:all .25s var(--ease);white-space:nowrap
}
.chip .sw{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);transition:all .25s var(--ease)}
.chip .sw svg{width:15px;height:15px}
.chip .sw .ms{font-size:15px}
.chip .n{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--surface-solid);color:var(--text-3)}
.chip:hover{color:var(--text);background:var(--surface)}
.chip.on{background:var(--surface-solid);color:var(--text);box-shadow:var(--shadow-md)}
.chip.on .sw{background:var(--c);color:#fff}
.chip.on .n{background:var(--c);color:#fff}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.game{
  --c:#5b5bd6;position:relative;display:flex;flex-direction:column;padding:10px;border-radius:var(--radius-lg);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;animation:fade .55s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)
}
.game:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.game .tile{
  position:relative;height:170px;border-radius:18px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 72%,#000));
}
.game .tile::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);right:-80px;top:-100px}
.game .tile::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(0,0,0,.08);left:-50px;bottom:-70px}
.game .ico{
  position:relative;z-index:1;width:92px;height:92px;border-radius:28px;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.18);backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 28px rgba(0,0,0,.18);
  transition:transform .35s var(--ease)
}
.game:hover .ico{transform:scale(1.1) rotate(-5deg)}
.game .ico svg{width:50px;height:50px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.game .ico .ms{font-size:50px}
.game .ico .ms{font-size:48px}
.game .ico .hi{font-family:'Noto Sans Devanagari',var(--font);font-size:50px;font-weight:700;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.game .cat{position:absolute;z-index:1;left:12px;top:12px;font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
.game .body{display:flex;flex-direction:column;padding:14px 8px 6px;min-width:0}
.game h3{margin:0 0 2px;font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game h3.hi{font-family:'Noto Sans Devanagari',var(--font);font-weight:700}
.game p{margin:0;font-size:12.5px;color:var(--text-3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.game .foot{display:flex;align-items:center;margin-top:12px}
.play{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;width:100%;border-radius:13px;font-size:13.5px;font-weight:800;
  background:var(--brand-soft);color:var(--c);transition:all .25s var(--ease)
}
.play svg{transition:transform .25s var(--ease)}
.play:hover,.game:hover .play{background:var(--c);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--c) 40%,transparent)}
.play:hover svg,.game:hover .play svg{transform:translateX(3px)}
.game .fav{position:absolute;z-index:2;top:18px;right:18px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.15);backdrop-filter:blur(6px);opacity:0;transition:all .25s var(--ease)}
.game:hover .fav,.game .fav.on{opacity:1}
.game .fav:hover{background:rgba(255,255,255,.9);color:var(--accent)}
.game .fav.on{color:#fff;background:var(--accent)}

.empty{display:grid;place-items:center;text-align:center;padding:70px 20px;border-radius:var(--radius-lg);border:1.5px dashed var(--border-strong);color:var(--text-2)}
.empty .big{width:64px;height:64px;color:var(--brand);margin-bottom:10px}.empty .big svg{width:100%;height:100%}.empty .big .ms{font-size:64px}
.empty b{font-size:18px;color:var(--text);display:block;margin-bottom:4px}
.empty button{margin-top:16px;height:40px;padding:0 18px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}

/* Search results view */
.result-group{margin-bottom:28px}
.result-group .gh{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;font-weight:800;color:var(--text-2)}
.result-group .gh .em{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}.result-group .gh .em svg{width:16px;height:16px}
.result-group .gh .n{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:50;padding:12px 18px;border-radius:14px;background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);transition:all .3s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}


/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1180px){.hero{grid-template-columns:1fr}.iso{display:none}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:min(320px,86vw);transform:translateX(-105%);transition:transform .35s var(--ease);box-shadow:var(--shadow-lg)}
  .app.drawer-open .sidebar{transform:none}
  .app.collapsed .sidebar{width:min(320px,86vw)}
  .collapse-btn{display:none}
  .menu-btn{display:grid}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,12,40,.45);backdrop-filter:blur(3px);z-index:19;opacity:0;pointer-events:none;transition:opacity .3s}
  .app.drawer-open .scrim{opacity:1;pointer-events:auto}
  .topbar{padding:14px 16px;flex-wrap:wrap}
  .topbar .eyebrow,.crumb{display:none}
  .search{margin-left:0;flex:1;width:auto;min-width:0}.search input{width:0}.search kbd{display:none}
  .content{padding:4px 16px 48px}
  .hero{padding:28px 22px;border-radius:26px}
  .detail-head{grid-template-columns:auto 1fr}
    .games{grid-template-columns:repeat(2,1fr);gap:12px}
  .class-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .class-card .tile{height:120px}.class-card .ico{width:70px;height:70px;border-radius:20px}.class-card .ico svg{width:36px;height:36px}
  }
@media (max-width:520px){
  .game .tile{height:130px}.game .ico{width:70px;height:70px;border-radius:20px}.game .ico svg{width:36px;height:36px}.game .ico .ms{font-size:34px}
.game .ico .hi{font-size:36px}
  .game h3{font-size:16px}.game p{display:none}.game .cat{display:none}
  .hero h1{letter-spacing:-1px}
  .filters{width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar" aria-label="Classes">
    <div class="brand">
      <a href="https://edubull.com" class="logo" aria-label="Edubull home"><img src="assets/logo.png" alt="Edubull — Creating AI Enabled Schools"></a>
      <div class="mark" aria-hidden="true">eb</div>
      <button class="collapse-btn" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <a class="side-cta" href="https://edubull.com/flipbooks27" title="Open EduLibrary flipbooks">
      <div class="ico"><span class="ms" aria-hidden="true">auto_stories</span></div>
      <div class="t"><small>EduLibrary</small><b>Read E‑Textbooks</b></div>
    </a>

    <nav class="nav" id="nav" aria-label="Choose a class"></nav>

  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="eyebrow"><span class="ms" aria-hidden="true">deployed_code</span>Edubull Studio</div>
      <div class="crumb" id="crumb"></div>
      <label class="search" id="searchBox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search simulations, subjects, classes…" autocomplete="off" aria-label="Search simulations">
        <kbd>/</kbd>
        <button class="clear" id="searchClear" type="button" aria-label="Clear search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </label>
    </header>

    <main class="content">
      <!-- ---------- VIEW: HOME (choose class) ---------- -->
      <section class="view active" id="viewHome" aria-label="Choose your class">
        <div class="hero">
          <div>
            <div class="greet"><span id="greetText">Good afternoon</span></div>
            <h1>Pick your <span>class</span></h1>
            <div class="steps">
              <div class="step"><i style="--c:#5b5bd6"><span class="ms" aria-hidden="true">school</span></i> Class</div><span class="step-arrow">→</span>
              <div class="step alt"><i style="--c:#f0567d"><span class="ms" aria-hidden="true">menu_book</span></i> Subject</div><span class="step-arrow">→</span>
              <div class="step alt2"><i style="--c:#11b981"><span class="ms" aria-hidden="true">deployed_code</span></i> Simulate</div>
            </div>
          </div>
          <div class="iso" id="iso" aria-hidden="true">
            <div class="iso-scene" id="isoScene"></div>
            <div class="iso-badge"><b id="statGames">0</b><span>Subject Simulations</span></div>
          </div>
        </div>
        <div id="classSections"></div>
      </section>

      <!-- ---------- VIEW: CLASS DETAIL (subjects/games) ---------- -->
      <section class="view" id="viewClass" aria-label="Subject simulations">
        <div class="detail-head">
          <button class="back" id="backBtn" aria-label="Back to all classes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
          <div class="title">
            <div class="k" id="dStage"></div>
            <h1><span class="big" id="dEmoji"></span><span id="dName"></span></h1>
            <p id="dSub"></p>
          </div>
        </div>
        <div class="filters" id="filters" role="tablist" aria-label="Filter by subject"></div>
        <div class="games" id="games"></div>
      </section>

      <!-- ---------- VIEW: SEARCH ---------- -->
      <section class="view" id="viewSearch" aria-label="Search results">
        <div class="section-head"><div><h2>Search results</h2><p id="searchMeta"></p></div></div>
        <div id="searchResults"></div>
      </section>
    </main>

  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   DATA — edit this block to add classes, subjects or games.
   Game links point to edubull.com/studio/<slug>; swap `url` as needed.
   ============================================================ */
const STAGES = [
  { id:'early',   name:'Early Years',   icon:'baby',     color:'#f59e0b', blurb:'Play-first foundations: sounds, strokes, shapes and numbers.' },
  { id:'primary', name:'Primary School',icon:'backpack', color:'#5b5bd6', blurb:'Core subjects turned into adventures, quests and puzzles.' },
  { id:'middle',  name:'Middle School', icon:'rocket',   color:'#0ea5a4', blurb:'Deeper concepts, logic, coding and real-world science.' },
];

const CLASSES = [
  { id:'early',   name:'Early Years', short:'EY', icon:'baby',     stage:'early',   color:'#f0567d' },
  { id:'class1',  name:'Class 1', short:'1', icon:'pencil',   stage:'primary', color:'#5b5bd6' },
  { id:'class2',  name:'Class 2', short:'2', icon:'palette',  stage:'primary', color:'#0ea5e9' },
  { id:'class3',  name:'Class 3', short:'3', icon:'backpack', stage:'primary', color:'#10b981' },
  { id:'class4',  name:'Class 4', short:'4', icon:'search',   stage:'primary', color:'#f97316' },
  { id:'class5',  name:'Class 5', short:'5', icon:'compass',  stage:'primary', color:'#ec4899' },
  { id:'class6',  name:'Class 6', short:'6', icon:'ruler',    stage:'middle',  color:'#0ea5a4' },
  { id:'class7',  name:'Class 7', short:'7', icon:'tube',     stage:'middle',  color:'#6366f1' },
  { id:'class8',  name:'Class 8', short:'8', icon:'rocket',   stage:'middle',  color:'#8b5cf6' },
];

const SUBJECTS = {
  math:     { name:'Mathematics',   color:'#10b981', icon:'calc' },
  science:  { name:'Science',       color:'#0ea5e9', icon:'flask' },
  english:  { name:'English',       color:'#f0567d', icon:'pencil' },
  grammar:  { name:'Grammar',       color:'#3b82f6', icon:'trophy' },
  hindi:    { name:'Hindi',         color:'#f59e0b', icon:'book' },
  sst:      { name:'SST',           color:'#f97316', icon:'map' },
  evs:      { name:'EVS',           color:'#22c55e', icon:'leaf' },
  ai:       { name:'CT',            color:'#8b5cf6', icon:'robot' },
  ga:       { name:'General Awareness', color:'#eab308', icon:'bulb' },
  allinone: { name:'All in One',    color:'#ec4899', icon:'star' },
  rhymes:   { name:'Rhymes',        color:'#d946ef', icon:'music' },
};

/* Class & UI icons: Material Symbols Rounded ligature names */
const CI = { home:'home', baby:'child_care', blocks:'extension', sparkles:'auto_awesome', pencil:'edit', palette:'palette', backpack:'backpack', search:'search', compass:'explore', ruler:'straighten', tube:'biotech', rocket:'rocket_launch', cap:'school', book:'menu_book', gamepad:'sports_esports', atom:'deployed_code', balloon:'celebration' };
const ci = (name, fill=false) => `<span class="ms${fill?' fill':''}" aria-hidden="true">${CI[name]||CI.sparkles}</span>`;

/* SVG icon library (keyed) */
const MSN = { calc:'calculate', flask:'science', robot:'smart_toy', pencil:'edit', trophy:'emoji_events', globe:'public', leaf:'eco', bulb:'lightbulb', star:'star', music:'music_note', shapes:'category', code:'code', atom:'deployed_code', book:'menu_book', map:'map' };
const ICONS = Object.fromEntries(Object.entries(MSN).map(([k,v])=>[k,`<span class="ms fill" aria-hidden="true">${v}</span>`]));
ICONS.hindiA='<span class="hi">अ</span>'; ICONS.hindiK='<span class="hi">क</span>';

/* classes: list of class ids the game is available for */
const E = ['early'];
const P = ['class1','class2','class3','class4','class5'];
const M = ['class6','class7','class8'];
const ALL = [...P,...M];
const GAMES = [
  /* ---- Early Years ---- */
  { id:'all-in-one',    subject:'allinone', title:'All in One', desc:'Colours, shapes, alphabets and numbers in one playful bundle.', icon:'star', classes:E, tags:['Audio','Touch'], url:'https://edubull.com/studio/all-in-one' },
  { id:'pre-writing',   subject:'english',  title:'Pre‑Writing', desc:'Pencil grip, tracing paths & fine motor skills.', icon:'pencil', classes:E, tags:['Tracing','Audio'], url:'https://edubull.com/studio/pre-writing' },
  { id:'rhymes',        subject:'rhymes',   title:'Rhyme Time', desc:'Sing-along rhymes with actions, beats and picture cues.', icon:'music', classes:E, tags:['Audio','Video'], url:'https://edubull.com/studio/rhymes' },
  { id:'hindi-swar',    subject:'hindi',    title:'हिंदी स्वर', titleHi:true, desc:'सचित्र स्वर पहचान और ध्वनि खेल', icon:'hindiA', classes:E, tags:['Audio','Pictures'], url:'https://edubull.com/studio/hindi-swar' },
  { id:'shapes-colours',subject:'math',     title:'Shapes & Colours', desc:'Sort, match and build with shapes, colours and patterns.', icon:'shapes', classes:E, tags:['Drag & drop'], url:'https://edubull.com/studio/shapes-colours' },
  { id:'number-ninja',  subject:'math',     title:'Number Ninja', desc:'Count, compare and pop numbers 1–50 with timed challenges.', icon:'calc', classes:E, tags:['Timed','Levels'], url:'https://edubull.com/studio/number-ninja' },
  { id:'general-awareness', subject:'ga',   title:'General Awareness', desc:'My body, family, seasons, helpers and the world around me.', icon:'bulb', classes:E, tags:['Quiz','Pictures'], url:'https://edubull.com/studio/general-awareness' },
  { id:'phonics-fun',   subject:'english',  title:'Phonics Fun', desc:'Letter sounds, blends and first sight words with monster friends.', icon:'book', classes:E, tags:['Audio','Sight words'], url:'https://edubull.com/studio/phonics-fun' },
  /* ---- Class 1–8: Maths · Science · CT ---- */
  { id:'math-adventure',  subject:'math',    title:'Math Adventure', desc:'Arithmetic, fractions & geometric puzzle world.', icon:'calc', classes:ALL, tags:['Levels','Leaderboard'], url:'https://edubull.com/studio/math-adventure' },
  { id:'science-explorer',subject:'science', title:'Science Explorer', desc:'Interactive natural science & STEM experiments.', icon:'flask', classes:ALL, tags:['Experiments','3D'], url:'https://edubull.com/studio/science-explorer' },
  { id:'ct-ai-quest',     subject:'ai',      title:'CT & AI Quest', desc:'Computational logic and algorithm basics.', icon:'robot', classes:ALL, tags:['Logic','Puzzles'], url:'https://edubull.com/studio/ct-ai-quest' },
  { id:'coding-blocks',   subject:'ai',      title:'Coding Blocks', desc:'Block-based coding: loops, conditions and your first robot.', icon:'code', classes:M, tags:['Blocks','Robotics'], url:'https://edubull.com/studio/coding-blocks' },
  { id:'atom-lab',        subject:'science', title:'Atom Lab', desc:'Matter, elements and reactions in a safe virtual laboratory.', icon:'atom', classes:M, tags:['Lab','3D'], url:'https://edubull.com/studio/atom-lab' },
];

/* ============================================================
   APP STATE & HELPERS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem('ebs:'+k); return v===null? d : JSON.parse(v);} catch{ return d; } },
  set(k, v){ try { localStorage.setItem('ebs:'+k, JSON.stringify(v)); } catch{} }
};
const state = { view:'home', classId:null, subject:'all', query:'', favs: new Set(store.get('favs', [])) };
const gamesFor = cid => GAMES.filter(g => g.classes.includes(cid));
const classById = id => CLASSES.find(c => c.id===id);
const app = $('#app');

/* ---------- Greeting ---------- */
(function(){ const h = new Date().getHours(); $('#greetText').textContent = h<12?'Good morning':h<17?'Good afternoon':'Good evening'; })();

/* ---------- Isometric tile cloud ---------- */
(function(){
  const scene=$('#isoScene'); if(!scene) return;
  const tiles=[['calc','#10b981'],['flask','#0ea5e9'],['robot','#8b5cf6'],['pencil','#f0567d'],['hindiA','#f59e0b'],['trophy','#3b82f6'],['globe','#f97316'],['leaf','#22c55e'],['code','#6366f1']];
  scene.innerHTML=tiles.map((t,i)=>`<div class="tile" style="--c:${t[1]};--i:${i}">${ICONS[t[0]]}</div>`).join('');
  const hero=scene.closest('.hero');
  hero.addEventListener('mousemove',e=>{const r=hero.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    scene.style.transform=`rotateX(${55-y*12}deg) rotateZ(${-38+x*14}deg)`;});
  hero.addEventListener('mouseleave',()=>{scene.style.transform='';});
})();

/* ---------- Count-up stat ---------- */
(function(){ const el=$('#statGames'), n=GAMES.length, t0=performance.now();
  const tick = now => { const p=Math.min(1,(now-t0)/900), e=1-Math.pow(1-p,3); el.textContent=Math.round(n*e); if(p<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick); })();

/* ---------- Sidebar ---------- */
function renderNav(){
  let html = `<button class="nav-item home" data-nav="home"><span class="em" style="--c:var(--brand)">${ci('home')}</span><span class="lbl">All Classes</span><span class="cnt">${CLASSES.length}</span></button>`;
  for(const st of STAGES){
    const stageClasses = CLASSES.filter(c=>c.stage===st.id);
    if(!(stageClasses.length===1 && stageClasses[0].name===st.name)) html += `<div class="nav-group">${esc(st.name)}</div>`;
    for(const c of stageClasses){
      html += `<button class="nav-item" data-nav="${c.id}" title="${esc(c.name)}"><span class="em" style="--c:${c.color}">${ci(c.icon)}</span><span class="lbl">${esc(c.name)}</span><span class="cnt">${gamesFor(c.id).length}</span></button>`;
    }
  }
  $('#nav').innerHTML = html;
  $('#nav').onclick = e => { const b = e.target.closest('[data-nav]'); if(!b) return; closeDrawer(); b.dataset.nav==='home' ? go('home') : go('class', b.dataset.nav); };
}
function syncNav(){ document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', state.view==='home' ? b.dataset.nav==='home' : b.dataset.nav===state.classId)); }
$('#collapseBtn').onclick = () => { app.classList.toggle('collapsed'); store.set('collapsed', app.classList.contains('collapsed')); };
if(store.get('collapsed', false)) app.classList.add('collapsed');
const closeDrawer = () => app.classList.remove('drawer-open');
$('#menuBtn').onclick = () => app.classList.toggle('drawer-open');
$('#scrim').onclick = closeDrawer;

/* ---------- Home view ---------- */
function renderHome(){
  let i=0, html='';
  for(const st of STAGES){
    const cls = CLASSES.filter(c=>c.stage===st.id);
    html += `<div class="section-head"><h2 style="--c:${st.color}"><span class="dot">${ci(st.icon)}</span>${esc(st.name)}</h2><div class="meta">${cls.length} class${cls.length===1?"":"es"}</div></div><div class="class-grid">`;
    for(const c of cls){
      const gs = gamesFor(c.id);
      html += `<button class="class-card" style="--c:${c.color};--i:${i++}" data-class="${c.id}" aria-label="Open ${esc(c.name)} simulations">
        <div class="tile"><span class="ico">${ci(c.icon,true)}</span><span class="pill">${ci('atom')}${gs.length} simulations</span></div>
        <div class="row"><div><h3>${esc(c.name)}</h3></div><span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
      </button>`;
    }
    html += `</div>`;
  }
  $('#classSections').innerHTML = html;
  $('#classSections').onclick = e => { const b = e.target.closest('[data-class]'); if(b) go('class', b.dataset.class); };
}

/* ---------- Class view ---------- */
function gameCard(g, i){
  const s = SUBJECTS[g.subject];
  const fav = state.favs.has(g.id);
  return `<article class="game" style="--c:${s.color};--i:${i}">
    <button class="fav ${fav?'on':''}" data-fav="${g.id}" aria-label="${fav?'Remove from':'Add to'} favourites" aria-pressed="${fav}"><svg width="18" height="18" viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    <div class="tile"><div class="ico">${ICONS[g.icon]||ICONS.star}</div><span class="cat">${esc(s.name)}</span></div>
    <div class="body">
      <h3 class="${g.titleHi?'hi':''}">${esc(g.title)}</h3>
      <p>${esc(g.desc)}</p>
      <div class="foot">
        <a class="play" href="${esc(g.url)}" aria-label="Open ${esc(g.title)}">Open <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
    </div>
  </article>`;
}
function renderClass(){
  const c = classById(state.classId); if(!c) return go('home');
  const st = STAGES.find(s=>s.id===c.stage);
  const all = gamesFor(c.id);
  $('#dStage').innerHTML = `${ci(st.icon)} ${esc(st.name)}`;
  $('#dEmoji').innerHTML = ci(c.icon); $('#dEmoji').style.setProperty('--c', c.color);
  $('#dName').textContent = c.name;
  $('#dSub').innerHTML = `${ci('atom')}${all.length} simulations`;


  // subject chips
  const subs = [...new Set(all.map(g=>g.subject))];
  if(state.subject!=='all' && !subs.includes(state.subject)) state.subject='all';
  const chip = (id,name,color,n,icon) => `<button class="chip ${state.subject===id?'on':''}" role="tab" aria-selected="${state.subject===id}" data-sub="${id}" style="--c:${color}"><span class="sw">${icon? (ICONS[icon]||'') : ci('sparkles')}</span>${esc(name)}</button>`;
  $('#filters').innerHTML = chip('all','All','var(--brand)',all.length) + subs.map(s=>chip(s,SUBJECTS[s].name,SUBJECTS[s].color,all.filter(g=>g.subject===s).length,SUBJECTS[s].icon)).join('');
  $('#filters').onclick = e => { const b=e.target.closest('[data-sub]'); if(!b) return; state.subject=b.dataset.sub; renderClass(); };

  const list = state.subject==='all' ? all : all.filter(g=>g.subject===state.subject);
  $('#games').innerHTML = list.length ? list.map(gameCard).join('')
    : `<div class="empty" style="grid-column:1/-1"><div class="big">${ci('balloon')}</div><b>No simulations here yet</b>New ${esc(c.name)} studios are on the way.<br><button data-sub="all">Show all subjects</button></div>`;
  $('#games').onclick = handleGameClick;
}
function handleGameClick(e){
  const f = e.target.closest('[data-fav]');
  if(f){ const id=f.dataset.fav; state.favs.has(id)?state.favs.delete(id):state.favs.add(id); store.set('favs',[...state.favs]);
    toast(state.favs.has(id)?'Added to favourites':'Removed from favourites'); state.view==='search'?renderSearch():renderClass(); return; }
  const s = e.target.closest('[data-sub]'); if(s){ state.subject=s.dataset.sub; renderClass(); }
}

/* ---------- Search view ---------- */
function renderSearch(){
  const q = state.query.trim().toLowerCase();
  const hit = g => [g.title, g.desc, SUBJECTS[g.subject].name, ...g.tags, ...g.classes.map(c=>classById(c).name)].join(' ').toLowerCase().includes(q);
  const matchCls = CLASSES.filter(c => c.name.toLowerCase().includes(q) || STAGES.find(s=>s.id===c.stage).name.toLowerCase().includes(q));
  const games = GAMES.filter(hit);
  let html='', total=games.length;
  if(matchCls.length){
    html += `<div class="result-group"><div class="gh"><span class="em">${ci('cap')}</span>Classes <span class="n">${matchCls.length}</span></div><div class="class-grid">` +
      matchCls.map((c,i)=>{ const gs=gamesFor(c.id); return `<button class="class-card" style="--c:${c.color};--i:${i}" data-class="${c.id}"><div class="tile"><span class="ico">${ci(c.icon,true)}</span><span class="pill">${ci('atom')}${gs.length} simulations</span></div><div class="row"><div><h3>${esc(c.name)}</h3></div><span class="arrow">→</span></div></button>`; }).join('') + `</div></div>`;
  }
  // group games by class stage for clarity
  for(const st of STAGES){
    const cls = CLASSES.filter(c=>c.stage===st.id).map(c=>c.id);
    const gs = games.filter(g=>g.classes.some(c=>cls.includes(c)));
    if(!gs.length) continue;
    html += `<div class="result-group"><div class="gh"><span class="em">${ci(st.icon)}</span>${esc(st.name)} <span class="n">${gs.length}</span></div><div class="games">${gs.map(gameCard).join('')}</div></div>`;
  }
  $('#searchMeta').textContent = `${total} simulation${total===1?'':'s'}${matchCls.length?` and ${matchCls.length} class${matchCls.length===1?'':'es'}`:''} for “${state.query.trim()}”`;
  $('#searchResults').innerHTML = html || `<div class="empty"><div class="big">${ci('search')}</div><b>Nothing found</b>Try “math”, “hindi”, “class 3” or “robot”.</div>`;
  $('#searchResults').onclick = e => { const b=e.target.closest('[data-class]'); if(b){ clearSearch(); go('class', b.dataset.class); return; } handleGameClick(e); };
}
const searchInput = $('#searchInput'), searchBox = $('#searchBox');
let searchTimer;
searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.query = searchInput.value; searchBox.classList.toggle('has-value', !!state.query); state.query.trim() ? show('search') : show(state.classId?'class':'home'); }, 120); });
function clearSearch(){ searchInput.value=''; state.query=''; searchBox.classList.remove('has-value'); }
$('#searchClear').onclick = () => { clearSearch(); show(state.classId?'class':'home'); searchInput.focus(); };

/* ---------- Routing ---------- */
function go(view, classId){
  state.view = view; if(view==='class'){ state.classId = classId; state.subject='all'; store.set('lastClass', classId); }
  clearSearch();
  location.hash = view==='class' ? `#/class/${classId}` : '#/';
  show(view);
  window.scrollTo({top:0, behavior:'smooth'});
}
function show(view){
  state.view = view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#view'+view[0].toUpperCase()+view.slice(1)).classList.add('active');
  if(view==='class') renderClass(); else if(view==='search') renderSearch();
  const c = classById(state.classId);
  $('#crumb').innerHTML = view==='class' && c ? `<button data-nav="home">${ci('home')} All classes</button><span>›</span><span class="cur">${esc(c.name)}</span>` : view==='search' ? `<span class="cur">Search</span>` : `<span class="cur">All classes</span>`;
  $('#crumb').onclick = e => e.target.closest('[data-nav]') && go('home');
  document.title = (view==='class' && c ? `${c.name} · ` : '') + 'Edubull Studio';
  syncNav();
}
function route(){
  const m = location.hash.match(/^#\/class\/([\w-]+)/);
  if(m && classById(m[1])){ state.classId = m[1]; state.subject='all'; show('class'); } else { show('home'); }
}
window.addEventListener('hashchange', route);
$('#backBtn').onclick = () => go('home');

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  const typing = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(e.key==='/' && !typing){ e.preventDefault(); searchInput.focus(); }
  if(e.key==='Escape'){ if(typing && searchInput.value){ clearSearch(); show(state.classId?'class':'home'); searchInput.blur(); } else if(app.classList.contains('drawer-open')) closeDrawer(); else if(state.view==='class') go('home'); }
});

/* ---------- Toast ---------- */
let toastTimer; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- Boot ---------- */
renderNav(); renderHome();
if(!location.hash && store.get('lastClass')) { /* land on home, but remember last class for the sidebar highlight */ }
route();
</script>
</body>
</html>
