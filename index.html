<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edubull Studio · Learning Games by Class</title>
<meta name="description" content="Edubull Studio — pick your class, then dive into subject-wise interactive learning games for Nursery to Class 8.">
<meta name="theme-color" content="#eef0fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b5bd6'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3Eeb%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --font: 'Plus Jakarta Sans', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bg: #eceefa;
  --bg-grad-1: #e6e5fb;
  --bg-grad-2: #f3e9f6;
  --bg-grad-3: #e3ecfb;
  --surface: rgba(255,255,255,.72);
  --surface-solid: #ffffff;
  --surface-2: rgba(255,255,255,.55);
  --surface-hover: rgba(255,255,255,.95);
  --border: rgba(99,102,241,.10);
  --border-strong: rgba(99,102,241,.22);
  --text: #141633;
  --text-2: #4a4d6b;
  --text-3: #80839c;
  --brand: #5b5bd6;
  --brand-2: #7c6cf0;
  --brand-soft: rgba(91,91,214,.10);
  --brand-soft-2: rgba(91,91,214,.18);
  --accent: #f0567d;
  --ring: rgba(91,91,214,.35);
  --shadow-sm: 0 1px 2px rgba(20,22,51,.05), 0 2px 8px rgba(20,22,51,.04);
  --shadow-md: 0 4px 16px rgba(20,22,51,.07), 0 12px 32px rgba(91,91,214,.08);
  --shadow-lg: 0 24px 64px rgba(40,44,110,.14), 0 4px 16px rgba(20,22,51,.06);
  --radius-xl: 32px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --sidebar-w: 300px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{
  --bg: #0f1021;
  --bg-grad-1: #171a3a;
  --bg-grad-2: #1f1530;
  --bg-grad-3: #0f1c33;
  --surface: rgba(28,30,58,.72);
  --surface-solid: #1a1c3a;
  --surface-2: rgba(28,30,58,.5);
  --surface-hover: rgba(36,38,72,.95);
  --border: rgba(255,255,255,.07);
  --border-strong: rgba(255,255,255,.14);
  --text: #f1f2ff;
  --text-2: #b7bad6;
  --text-3: #7e819f;
  --brand: #8b8bff;
  --brand-2: #a79bff;
  --brand-soft: rgba(139,139,255,.14);
  --brand-soft-2: rgba(139,139,255,.24);
  --accent: #ff6f95;
  --ring: rgba(139,139,255,.45);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.25);
  --shadow-lg: 0 24px 64px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);color:var(--text);background:var(--bg);
  min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(1200px 700px at 8% -10%, var(--bg-grad-1), transparent 60%),
    radial-gradient(900px 600px at 100% 10%, var(--bg-grad-2), transparent 60%),
    radial-gradient(900px 700px at 60% 110%, var(--bg-grad-3), transparent 60%),
    var(--bg);
  transition:background .4s var(--ease);
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:12px}
::selection{background:var(--brand-soft-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;transition:grid-template-columns .35s var(--ease)}
.app.collapsed{--sidebar-w:88px}

/* ---------- Sidebar ---------- */
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
  padding:22px 16px;background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--border);overflow:hidden;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px;min-height:64px}
.brand .mark{
  width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#5b5bd6,#f0567d);color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px;
  box-shadow:0 6px 16px rgba(91,91,214,.35);
}
.brand .word{font-size:26px;font-weight:800;letter-spacing:-.8px;color:var(--brand);white-space:nowrap;transition:opacity .2s}
.brand .word em{font-style:normal;color:var(--text)}
.collapse-btn{
  margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  color:var(--text-3);transition:all .2s var(--ease);flex:none
}
.collapse-btn:hover{background:var(--brand-soft);color:var(--brand)}
.collapse-btn svg{transition:transform .35s var(--ease)}
.collapsed .collapse-btn svg{transform:rotate(180deg)}

.side-cta{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--brand-soft),rgba(240,86,125,.08));
  border:1px solid var(--border-strong);transition:all .25s var(--ease);margin-bottom:8px;
}
.side-cta:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.side-cta .ico{width:40px;height:40px;border-radius:12px;background:var(--surface-solid);display:grid;place-items:center;color:var(--brand);flex:none;box-shadow:var(--shadow-sm)}
.side-cta .t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.side-cta small{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--brand)}
.side-cta b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 2px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.nav::-webkit-scrollbar{width:5px}.nav::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px}
.nav-group{margin:12px 0 4px;padding:0 10px;font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden}
.nav-item{
  width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;
  color:var(--text-2);font-weight:600;font-size:14.5px;transition:all .2s var(--ease);position:relative;text-align:left
}
.nav-item .em{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--surface-2);flex:none;transition:transform .2s var(--ease)}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .cnt{font-size:11px;font-weight:700;min-width:26px;height:22px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.nav-item:hover{background:var(--brand-soft);color:var(--text)}
.nav-item:hover .em{transform:scale(1.1) rotate(-6deg)}
.nav-item.active{background:var(--surface-solid);color:var(--brand);box-shadow:var(--shadow-sm)}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.nav-item.active .cnt{background:var(--brand);color:#fff}
.nav-item.home{margin-bottom:4px}


.collapsed .brand .word,.collapsed .side-cta .t,.collapsed .nav-item .lbl,.collapsed .nav-item .cnt,.collapsed .nav-group,.collapsed .collapsed .brand{justify-content:center;flex-direction:column;gap:10px;padding-bottom:8px}
.collapsed .collapse-btn{margin:0}
.collapsed .side-cta,.collapsed .nav-item{justify-content:center;padding:10px}
.collapsed .nav-item.active::before{display:none}

/* ---------- Main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.scrim{display:none}
.topbar{
  position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;
  padding:18px 36px;background:linear-gradient(var(--bg), transparent);
}
.topbar .eyebrow{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-3);letter-spacing:.3px}
.crumb button{font-weight:700;color:var(--text-3);padding:4px 8px;border-radius:8px;transition:all .2s}
.crumb button:hover{color:var(--brand);background:var(--brand-soft)}
.crumb .cur{color:var(--text);padding:4px 8px}
.search{
  margin-left:auto;display:flex;align-items:center;gap:10px;width:min(380px,100%);height:48px;padding:0 16px;
  border-radius:16px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);transition:all .25s var(--ease)
}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft-2),var(--shadow-md);background:var(--surface-solid)}
.search svg{color:var(--text-3);flex:none}
.search input{flex:1;border:0;background:none;font:inherit;font-size:14.5px;color:var(--text);outline:none;min-width:0}
.search input::placeholder{color:var(--text-3)}
.search kbd{font-family:inherit;font-size:11px;font-weight:700;color:var(--text-3);padding:3px 7px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface-2)}
.search .clear{display:none;width:24px;height:24px;border-radius:8px;display:none;place-items:center;color:var(--text-3)}
.search.has-value .clear{display:grid}.search.has-value kbd{display:none}
.search .clear:hover{background:var(--brand-soft);color:var(--brand)}
.menu-btn{display:none;width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);place-items:center;color:var(--text-2)}

.content{padding:8px 36px 60px;flex:1}
.view{display:none;animation:fade .5s var(--ease)}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============================================================
   VIEW 1 — CHOOSE CLASS
   ============================================================ */
.hero{
  position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:center;
  padding:40px 44px;border-radius:var(--radius-xl);overflow:hidden;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);backdrop-filter:blur(24px);margin-bottom:34px
}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 300px at 90% 0%,var(--brand-soft),transparent 70%)}
.hero .greet{font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hero h1{margin:8px 0 18px;font-size:clamp(34px,4vw,52px);font-weight:800;letter-spacing:-1.6px;line-height:1.05}
.hero h1 span{background:linear-gradient(90deg,var(--brand),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 18px;font-size:16px;color:var(--text-2);max-width:520px}
.hero .steps{display:flex;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:999px;background:var(--surface-solid);border:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text-2);box-shadow:var(--shadow-sm)}
.step i{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-style:normal;font-size:15px;background:var(--brand-soft)}
.step-arrow{align-self:center;color:var(--text-3);font-weight:700}
.step.alt i{background:var(--accent)}
.step.alt2 i{background:#11b981}

/* Orbit stat */
.orbit{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.orbit .ring{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--border-strong);animation:spin 50s linear infinite}
.orbit .ring.r2{inset:11%;border-style:solid;border-color:var(--border);animation-direction:reverse;animation-duration:38s}
.orbit .core{
  width:58%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--surface-solid);box-shadow:var(--shadow-lg),inset 0 0 0 10px var(--brand-soft);
}
.orbit .core b{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--text)}
.orbit .core span{font-size:13px;font-weight:600;color:var(--text-2);margin-top:4px}
.orbit .sat{
  position:absolute;width:44px;height:44px;border-radius:14px;background:var(--surface-solid);display:grid;place-items:center;font-size:20px;
  box-shadow:var(--shadow-md);animation:float 5s ease-in-out infinite
}
.orbit .sat:nth-child(4){top:3%;left:16%}
.orbit .sat:nth-child(5){top:12%;right:6%;animation-delay:-1.3s}
.orbit .sat:nth-child(6){bottom:8%;left:8%;animation-delay:-2.4s}
.orbit .sat:nth-child(7){bottom:4%;right:16%;animation-delay:-3.6s}
.orbit .tag{position:absolute;font-size:10px;font-weight:800;letter-spacing:2.5px;color:var(--text-3)}
.orbit .tag.t{top:-6px;left:50%;transform:translateX(-50%)}
.orbit .tag.b{bottom:-6px;left:50%;transform:translateX(-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:30px 0 16px}
.section-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}
.section-head h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--brand));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--brand)) 20%,transparent)}
.section-head p{margin:2px 0 0;font-size:13.5px;color:var(--text-3)}
.section-head .meta{font-size:12.5px;font-weight:700;color:var(--text-3)}

.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.class-card{
  --c:var(--brand);position:relative;display:flex;flex-direction:column;gap:0;padding:10px;border-radius:var(--radius-lg);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);text-align:left;overflow:hidden;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);
  animation:fade .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)
}
.class-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.class-card .tile{
  position:relative;height:150px;border-radius:18px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 18%,#fff),color-mix(in srgb,var(--c) 48%,#fff));
}
:root[data-theme="dark"] .class-card .tile{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 28%,#1a1c3a),color-mix(in srgb,var(--c) 62%,#1a1c3a))}
.class-card .tile::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.28);right:-60px;top:-70px}
.class-card .tile::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.2);left:-40px;bottom:-50px}
.class-card .ico{font-size:72px;line-height:1;filter:drop-shadow(0 10px 14px color-mix(in srgb,var(--c) 45%,transparent));transition:transform .4s var(--ease);position:relative;z-index:1}
.class-card:hover .ico{transform:scale(1.15) rotate(-8deg)}
.class-card .pill{position:absolute;top:10px;right:10px;z-index:1;font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.85);color:var(--c)}
:root[data-theme="dark"] .class-card .pill{background:rgba(0,0,0,.35);color:#fff}
.class-card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 8px 6px}
.class-card h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.5px}
.class-card .sub{font-size:12.5px;color:var(--text-3)}
.class-card .arrow{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--brand-soft);color:var(--c);transition:all .3s var(--ease);flex:none}
.class-card:hover .arrow{background:var(--c);color:#fff;transform:translateX(4px)}

/* ============================================================
   VIEW 2 — CLASS DETAIL / SUBJECT GAMES
   ============================================================ */
.detail-head{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-bottom:26px}
.back{
  width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow-sm);color:var(--text-2);transition:all .25s var(--ease)
}
.back:hover{background:var(--brand);color:#fff;transform:translateX(-3px);box-shadow:var(--shadow-md)}
.detail-head .title .k{font-size:12.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand);display:flex;align-items:center;gap:8px}
.detail-head h1{margin:2px 0 4px;font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-1.4px;line-height:1.05;display:flex;align-items:center;gap:12px}
.detail-head h1 .big{font-size:1.1em;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.detail-head p{margin:0;color:var(--text-2);font-size:14.5px}

.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px;padding:6px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);width:fit-content;max-width:100%}
.chip{
  --c:var(--brand);display:flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:14px;font-size:13.5px;font-weight:700;color:var(--text-2);
  transition:all .25s var(--ease);white-space:nowrap
}
.chip .sw{width:10px;height:10px;border-radius:4px;background:var(--c);opacity:.7}
.chip .n{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--surface-solid);color:var(--text-3)}
.chip:hover{color:var(--text);background:var(--surface)}
.chip.on{background:var(--surface-solid);color:var(--text);box-shadow:var(--shadow-md)}
.chip.on .sw{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.chip.on .n{background:var(--c);color:#fff}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.game{
  --c:#5b5bd6;position:relative;display:flex;flex-direction:column;padding:10px;border-radius:var(--radius-lg);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;animation:fade .55s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)
}
.game:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.game .tile{
  position:relative;height:170px;border-radius:18px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 72%,#000));
}
.game .tile::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);right:-80px;top:-100px}
.game .tile::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(0,0,0,.08);left:-50px;bottom:-70px}
.game .ico{
  position:relative;z-index:1;width:92px;height:92px;border-radius:28px;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.18);backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 28px rgba(0,0,0,.18);
  transition:transform .35s var(--ease)
}
.game:hover .ico{transform:scale(1.1) rotate(-5deg)}
.game .ico svg{width:50px;height:50px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.game .ico .hi{font-family:'Noto Sans Devanagari',var(--font);font-size:50px;font-weight:700;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}

.play{

}
:root[data-theme="dark"] .play{color:#fff}
.play svg{transition:transform .25s var(--ease)}
.play:hover,.game:hover .play{background:var(--c);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--c) 40%,transparent)}
.play:hover svg,.game:hover .play svg{transform:translateX(3px)}
.game .fav{position:absolute;z-index:2;top:18px;right:18px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.15);backdrop-filter:blur(6px);opacity:0;transition:all .25s var(--ease)}
.game:hover .fav,.game .fav.on{opacity:1}
.game .fav:hover{background:rgba(255,255,255,.9);color:var(--accent)}
.game .fav.on{color:#fff;background:var(--accent)}

.empty{display:grid;place-items:center;text-align:center;padding:70px 20px;border-radius:var(--radius-lg);border:1.5px dashed var(--border-strong);color:var(--text-2)}
.empty .big{font-size:46px;margin-bottom:10px}
.empty b{font-size:18px;color:var(--text);display:block;margin-bottom:4px}
.empty button{margin-top:16px;height:40px;padding:0 18px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}

/* Search results view */
.result-group{margin-bottom:28px}
.result-group .gh{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;font-weight:800;color:var(--text-2)}
.result-group .gh .em{font-size:18px}
.result-group .gh .n{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:50;padding:12px 18px;border-radius:14px;background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);transition:all .3s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem('ebs:'+k); return v===null? d : JSON.parse(v);} catch{ return d; } },
  set(k, v){ try { localStorage.setItem('ebs:'+k, JSON.stringify(v)); } catch{} }
};
const state = { view:'home', classId:null, subject:'all', query:'', favs: new Set(store.get('favs', [])) };
const gamesFor = cid => GAMES.filter(g => g.classes.includes(cid));
const classById = id => CLASSES.find(c => c.id===id);
const app = $('#app');

/* ---------- Theme ---------- */
function setTheme(t, save=true){
  document.documentElement.dataset.theme = t;
  $('meta[name=theme-color]').content = t==='dark' ? '#0f1021' : '#eef0fb';
  if(save) store.set('theme', t);
}
setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light', false);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => setTheme(e.matches?'dark':'light', false));

/* ---------- Greeting ---------- */
(function(){ const h = new Date().getHours(); $('#greetText').textContent = h<12?'Good morning':h<17?'Good afternoon':'Good evening'; })();

/* ---------- Count-up stat ---------- */
(function(){ const el=$('#statGames'), n=GAMES.length, t0=performance.now();
  const tick = now => { const p=Math.min(1,(now-t0)/900), e=1-Math.pow(1-p,3); el.textContent=Math.round(n*e); if(p<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick); })();

/* ---------- Sidebar ---------- */
function renderNav(){
  let html = `<button class="nav-item home" data-nav="home"><span class="em">🏠</span><span class="lbl">All Classes</span><span class="cnt">${CLASSES.length}</span></button>`;
  for(const st of STAGES){
    html += `<div class="nav-group">${esc(st.name)}</div>`;
    for(const c of CLASSES.filter(c=>c.stage===st.id)){
      html += `<button class="nav-item" data-nav="${c.id}" title="${esc(c.name)}"><span class="em">${c.emoji}</span><span class="lbl">${esc(c.name)}</span><span class="cnt">${gamesFor(c.id).length}</span></button>`;
    }
  }
  $('#nav').innerHTML = html;
  $('#nav').onclick = e => { const b = e.target.closest('[data-nav]'); if(!b) return; closeDrawer(); b.dataset.nav==='home' ? go('home') : go('class', b.dataset.nav); };
}
function syncNav(){ document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', state.view==='home' ? b.dataset.nav==='home' : b.dataset.nav===state.classId)); }
$('#collapseBtn').onclick = () => { app.classList.toggle('collapsed'); store.set('collapsed', app.classList.contains('collapsed')); };
if(store.get('collapsed', false)) app.classList.add('collapsed');
const closeDrawer = () => app.classList.remove('drawer-open');
$('#menuBtn').onclick = () => app.classList.toggle('drawer-open');
$('#scrim').onclick = closeDrawer;

/* ---------- Home view ---------- */
function renderHome(){
  let i=0, html='';
  for(const st of STAGES){
    const cls = CLASSES.filter(c=>c.stage===st.id);
    html += `<div class="section-head"><h2 style="--c:${st.color}"><span class="dot"></span>${esc(st.name)}</h2><div class="meta">${cls.length} classes</div></div><div class="class-grid">`;
    for(const c of cls){
      const gs = gamesFor(c.id);
      html += `<button class="class-card" style="--c:${c.color};--i:${i++}" data-class="${c.id}" aria-label="Open ${esc(c.name)} games">
        <div class="tile"><span class="ico">${c.emoji}</span><span class="pill">${gs.length} games</span></div>
        <div class="row"><div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.sub)}</div></div><span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
      </button>`;
    }
    html += `</div>`;
  }
  $('#classSections').innerHTML = html;
  $('#classSections').onclick = e => { const b = e.target.closest('[data-class]'); if(b) go('class', b.dataset.class); };
}

/* ---------- Class view ---------- */
function gameCard(g, i){
  const s = SUBJECTS[g.subject];
  const fav = state.favs.has(g.id);
  return `<article class="game" style="--c:${s.color};--i:${i}">
    <button class="fav ${fav?'on':''}" data-fav="${g.id}" aria-label="${fav?'Remove from':'Add to'} favourites" aria-pressed="${fav}"><svg width="18" height="18" viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    <div class="tile"><div class="ico">${ICONS[g.icon]||ICONS.star}</div><span class="cat">${esc(s.name)}</span></div>
    <div class="body">
      <h3 class="${g.titleHi?'hi':''}">${esc(g.title)}</h3>
      <p>${esc(g.desc)}</p>
      <div class="foot">
        <a class="play" href="${esc(g.url)}" aria-label="Play ${esc(g.title)}">Play <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
    </div>
  </article>`;
}
function renderClass(){
  const c = classById(state.classId); if(!c) return go('home');
  const st = STAGES.find(s=>s.id===c.stage);
  const all = gamesFor(c.id);
  $('#dStage').textContent = st.name;
  $('#dEmoji').textContent = c.emoji;
  $('#dName').textContent = c.name;
  $('#dSub').textContent = `${c.sub} · ${all.length} games`;


  // subject chips
  const subs = [...new Set(all.map(g=>g.subject))];
  if(state.subject!=='all' && !subs.includes(state.subject)) state.subject='all';
  const chip = (id,name,color,n) => `<button class="chip ${state.subject===id?'on':''}" role="tab" aria-selected="${state.subject===id}" data-sub="${id}" style="--c:${color}"><span class="sw"></span>${esc(name)}</button>`;
  $('#filters').innerHTML = chip('all','All','var(--brand)',all.length) + subs.map(s=>chip(s,SUBJECTS[s].name,SUBJECTS[s].color,all.filter(g=>g.subject===s).length)).join('');
  $('#filters').onclick = e => { const b=e.target.closest('[data-sub]'); if(!b) return; state.subject=b.dataset.sub; renderClass(); };

  const list = state.subject==='all' ? all : all.filter(g=>g.subject===state.subject);
  $('#games').innerHTML = list.length ? list.map(gameCard).join('')
    : `<div class="empty" style="grid-column:1/-1"><div class="big">🎈</div><b>No games here yet</b>New ${esc(c.name)} studios are on the way.<br><button data-sub="all">Show all subjects</button></div>`;
  $('#games').onclick = handleGameClick;
}
function handleGameClick(e){
  const f = e.target.closest('[data-fav]');
  if(f){ const id=f.dataset.fav; state.favs.has(id)?state.favs.delete(id):state.favs.add(id); store.set('favs',[...state.favs]);
    toast(state.favs.has(id)?'Added to favourites ♥':'Removed from favourites'); state.view==='search'?renderSearch():renderClass(); return; }
  const s = e.target.closest('[data-sub]'); if(s){ state.subject=s.dataset.sub; renderClass(); }
}

/* ---------- Search view ---------- */
function renderSearch(){
  const q = state.query.trim().toLowerCase();
  const hit = g => [g.title, g.desc, SUBJECTS[g.subject].name, ...g.tags, ...g.classes.map(c=>classById(c).name)].join(' ').toLowerCase().includes(q);
  const matchCls = CLASSES.filter(c => c.name.toLowerCase().includes(q) || STAGES.find(s=>s.id===c.stage).name.toLowerCase().includes(q));
  const games = GAMES.filter(hit);
  let html='', total=games.length;
  if(matchCls.length){
    html += `<div class="result-group"><div class="gh"><span class="em">🎓</span>Classes <span class="n">${matchCls.length}</span></div><div class="class-grid">` +
      matchCls.map((c,i)=>{ const gs=gamesFor(c.id); return `<button class="class-card" style="--c:${c.color};--i:${i}" data-class="${c.id}"><div class="tile"><span class="ico">${c.emoji}</span><span class="pill">${gs.length} games</span></div><div class="row"><div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.sub)}</div></div><span class="arrow">→</span></div></button>`; }).join('') + `</div></div>`;
  }
  // group games by class stage for clarity
  for(const st of STAGES){
    const cls = CLASSES.filter(c=>c.stage===st.id).map(c=>c.id);
    const gs = games.filter(g=>g.classes.some(c=>cls.includes(c)));
    if(!gs.length) continue;
    html += `<div class="result-group"><div class="gh"><span class="em">${st.id==='early'?'🧸':st.id==='primary'?'🎒':'🚀'}</span>${esc(st.name)} <span class="n">${gs.length}</span></div><div class="games">${gs.map(gameCard).join('')}</div></div>`;
  }
  $('#searchMeta').textContent = `${total} game${total===1?'':'s'}${matchCls.length?` and ${matchCls.length} class${matchCls.length===1?'':'es'}`:''} for “${state.query.trim()}”`;
  $('#searchResults').innerHTML = html || `<div class="empty"><div class="big">🔍</div><b>Nothing found</b>Try “math”, “hindi”, “class 3” or “robot”.</div>`;
  $('#searchResults').onclick = e => { const b=e.target.closest('[data-class]'); if(b){ clearSearch(); go('class', b.dataset.class); return; } handleGameClick(e); };
}
const searchInput = $('#searchInput'), searchBox = $('#searchBox');
let searchTimer;
searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.query = searchInput.value; searchBox.classList.toggle('has-value', !!state.query); state.query.trim() ? show('search') : show(state.classId?'class':'home'); }, 120); });
function clearSearch(){ searchInput.value=''; state.query=''; searchBox.classList.remove('has-value'); }
$('#searchClear').onclick = () => { clearSearch(); show(state.classId?'class':'home'); searchInput.focus(); };

/* ---------- Routing ---------- */
function go(view, classId){
  state.view = view; if(view==='class'){ state.classId = classId; state.subject='all'; store.set('lastClass', classId); }
  clearSearch();
  location.hash = view==='class' ? `#/class/${classId}` : '#/';
  show(view);
  window.scrollTo({top:0, behavior:'smooth'});
}
function show(view){
  state.view = view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#view'+view[0].toUpperCase()+view.slice(1)).classList.add('active');
  if(view==='class') renderClass(); else if(view==='search') renderSearch();
  const c = classById(state.classId);
  $('#crumb').innerHTML = view==='class' && c ? `<button data-nav="home">All classes</button><span>›</span><span class="cur">${esc(c.name)}</span>` : view==='search' ? `<span class="cur">Search</span>` : `<span class="cur">All classes</span>`;
  $('#crumb').onclick = e => e.target.closest('[data-nav]') && go('home');
  document.title = (view==='class' && c ? `${c.name} · ` : '') + 'Edubull Studio';
  syncNav();
}
function route(){
  const m = location.hash.match(/^#\/class\/([\w-]+)/);
  if(m && classById(m[1])){ state.classId = m[1]; state.subject='all'; show('class'); } else { show('home'); }
}
window.addEventListener('hashchange', route);
$('#backBtn').onclick = () => go('home');

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  const typing = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(e.key==='/' && !typing){ e.preventDefault(); searchInput.focus(); }
  if(e.key==='Escape'){ if(typing && searchInput.value){ clearSearch(); show(state.classId?'class':'home'); searchInput.blur(); } else if(app.classList.contains('drawer-open')) closeDrawer(); else if(state.view==='class') go('home'); }
});

/* ---------- Toast ---------- */
let toastTimer; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- Boot ---------- */
renderNav(); renderHome();
if(!location.hash && store.get('lastClass')) { /* land on home, but remember last class for the sidebar highlight */ }
route();
</script>
</body>
</html>
