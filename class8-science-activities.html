<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 8 Science Activity · Edubull</title>
<meta name="description" content="Class 8 Science Activity by Edubull — hands-on activity videos for every chapter.">
<meta name="theme-color" content="#fff8ee">
<meta name="color-scheme" content="light only">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff7a1a'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3Eeb%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
<style>
:root{
  --font:'Nunito',system-ui,sans-serif;--display:'Baloo 2',var(--font);
  --bg:#fff8ee;--paper:#fff;--cream:#fff1dc;--line:#f1e3cc;--ink:#2b2340;--ink-2:#6b6180;--ink-3:#a399b3;
  --orange:#ff7a1a;--yellow:#ffc233;--green:#2dc98a;--blue:#2f8bff;--pink:#ff5c8a;--violet:#8b5cf6;
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(700px 400px at 0% 0%,#ffe9cf,transparent 60%),radial-gradient(600px 400px at 100% 100%,#e4f3ff,transparent 60%);}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:14px}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-size:var(--is,24px);line-height:1;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;user-select:none;vertical-align:middle}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}

/* ---------- Top ---------- */
.top{display:flex;align-items:center;gap:16px;padding:16px 28px;max-width:1280px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.3px}
.logo .mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--font);font-size:14px;font-weight:900;background:linear-gradient(135deg,#5b5bd6,#f0567d);box-shadow:0 8px 18px rgba(91,91,214,.3);transform:rotate(-6deg)}
.logo small{display:block;font-family:var(--font);font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--orange);line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--cream);color:var(--orange);font-weight:800;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase}
.chip .ms{--is:16px}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:999px;background:var(--paper);border:2px solid var(--line);width:min(320px,100%);transition:all .2s}
.search:focus-within{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,122,26,.15)}
.search .ms{--is:20px;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink-3);font-weight:600}
.search .clear{display:none;color:var(--ink-3)}.search.has .clear{display:grid}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:330px 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:4px 28px 60px;align-items:start}
.notebook{position:sticky;top:16px;padding:16px;border-radius:30px;background:var(--paper);border:2px solid var(--line);box-shadow:0 20px 50px -20px rgba(43,35,64,.18)}
.notebook .nh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 12px}
.notebook .nh h2{margin:0;font-family:var(--display);font-size:22px;font-weight:800}
.notebook .nh span{font-size:12px;font-weight:800;color:var(--ink-3)}
.chapters{display:grid;gap:8px;max-height:calc(100vh - 140px);overflow:auto;padding:2px;scrollbar-width:thin}
.ch{--c:var(--orange);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px 10px 10px;border-radius:18px;text-align:left;border:2px solid transparent;transition:all .22s var(--ease)}
.ch:hover{background:var(--cream)}
.ch.active{background:color-mix(in srgb,var(--c) 10%,#fff);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.ch .tab{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:17px;font-weight:800;background:var(--c);box-shadow:0 6px 14px color-mix(in srgb,var(--c) 35%,transparent);transition:transform .3s var(--pop)}
.ch:hover .tab,.ch.active .tab{transform:rotate(-8deg) scale(1.05)}
.ch .t{font-size:13.5px;font-weight:800;line-height:1.25;color:var(--ink)}
.ch .m{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-top:2px}
.ch .badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--cream);color:var(--ink-2)}
.ch.active .badge{background:var(--c);color:#fff}
.ch.soon .tab{background:#d9d3e3;box-shadow:none}
.ch.soon .badge{background:#f1eef6;color:var(--ink-3)}

/* ---------- Stage ---------- */
.stage{min-width:0}
.banner{--c:var(--orange);position:relative;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:26px 30px;border-radius:30px;overflow:hidden;background:var(--c);color:#fff;box-shadow:0 30px 60px -24px color-mix(in srgb,var(--c) 80%,#000);margin-bottom:22px;animation:fade .4s var(--ease)}
.banner::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;right:120px;top:-200px;background:rgba(255,255,255,.18)}
.banner::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;left:-60px;bottom:-120px;background:rgba(0,0,0,.08)}
.banner .lv{position:relative;font-size:11.5px;font-weight:900;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.banner h1{position:relative;margin:4px 0 8px;font-family:var(--display);font-size:clamp(24px,3.4vw,42px);font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.banner .meta{position:relative;display:flex;gap:14px;font-size:13.5px;font-weight:800;opacity:.95}
.banner .meta span{display:flex;align-items:center;gap:5px}.banner .meta .ms{--is:18px}
.banner .big{position:relative;width:120px;height:120px;border-radius:36px;display:grid;place-items:center;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);transform:rotate(8deg)}
.banner .big .ms{--is:64px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.banner .nav{position:absolute;right:20px;bottom:18px;display:flex;gap:6px}
.banner .nav button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);transition:all .2s}
.banner .nav button:hover:not(:disabled){background:#fff;color:var(--c)}
.banner .nav button:disabled{opacity:.35;cursor:not-allowed}

.acts{display:grid;gap:16px}
.act{--c:var(--orange);display:grid;grid-template-columns:260px 1fr;border-radius:26px;overflow:hidden;background:var(--paper);border:2px solid var(--line);transition:transform .3s var(--pop),box-shadow .3s,border-color .3s;animation:fade .4s var(--ease) both;animation-delay:calc(var(--i)*50ms)}
.act:hover{transform:translateY(-4px);box-shadow:0 24px 50px -20px rgba(43,35,64,.3);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.act .thumb{position:relative;display:grid;place-items:center;min-height:170px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));overflow:hidden}
.act .thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35),transparent 45%),radial-gradient(circle at 90% 90%,rgba(0,0,0,.12),transparent 40%)}
.act .thumb .play{position:relative;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--c);box-shadow:0 12px 26px rgba(0,0,0,.25);transition:transform .3s var(--pop)}
.act:hover .thumb .play{transform:scale(1.15)}
.act .thumb .play .ms{--is:38px}
.act .thumb .no{position:absolute;left:12px;top:12px;font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--c)}
.act .body{display:flex;flex-direction:column;gap:8px;padding:20px 22px}
.act h3{margin:0;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.15}
.act p{margin:0;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.act .row{display:flex;gap:10px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:900;background:var(--cream);color:var(--ink);transition:all .25s var(--pop);white-space:nowrap}
.btn .ms{--is:20px}
.btn.go{background:var(--c,var(--orange));color:#fff;box-shadow:0 10px 22px color-mix(in srgb,var(--c,var(--orange)) 40%,transparent)}
.btn.go:hover{transform:translateY(-2px) scale(1.03)}
.btn:not(.go):hover{background:var(--line)}
.act.soon .thumb{background:linear-gradient(135deg,#e6e1ef,#cfc8dc)}
.act.soon .thumb .play{color:var(--ink-3)}
.act.soon .btn.go{background:#ece8f2;color:var(--ink-3);box-shadow:none;cursor:default}
.act.soon .btn.go:hover{transform:none}

.empty{text-align:center;padding:60px 20px;border-radius:26px;border:2px dashed var(--line);color:var(--ink-2);background:var(--paper)}
.empty .ms{--is:56px;color:var(--orange);display:block;margin:0 auto 8px}
.empty b{display:block;font-size:18px;color:var(--ink)}
.group{margin-bottom:22px}.group .gh{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--display);font-size:20px;font-weight:800}
.group .gh .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;color:#fff;background:var(--c,var(--orange));transform:rotate(-8deg)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Player ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(43,35,64,.7);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.modal .box{--c:var(--orange);width:min(1000px,100%);border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 40px 80px rgba(0,0,0,.4),0 0 0 8px color-mix(in srgb,var(--c) 30%,transparent);transform:translateY(16px) scale(.97);transition:transform .35s var(--pop)}
.modal.open .box{transform:none}
.modal .head{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px}
.modal .head .tag{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:#fff;padding:5px 10px;border-radius:999px;background:var(--c);white-space:nowrap}
.modal .head h3{margin:0;font-family:var(--display);font-size:18px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .head .btn{height:38px;width:38px;padding:0}
.modal video{display:block;width:100%;aspect-ratio:16/9;background:#000;outline:none}
.modal .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;font-size:13px;font-weight:700;color:var(--ink-2);flex-wrap:wrap}
.modal .foot .nav{display:flex;gap:8px}.modal .foot .btn{height:40px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;z-index:60;padding:12px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:all .35s var(--pop);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
footer{padding:20px;text-align:center;color:var(--ink-3);font-size:12.5px;font-weight:700}footer b{color:var(--ink-2)}

@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr);padding:4px 16px 50px}.notebook{position:static;padding:10px;min-width:0}
  .chapters{display:flex;gap:8px;overflow-x:auto;max-height:none;padding:4px 2px 8px;scrollbar-width:none}.chapters::-webkit-scrollbar{display:none}
  .ch{flex:none;width:230px}.notebook .nh{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}.top .chip{display:none}.search{width:100%}
  .banner{padding:20px;grid-template-columns:1fr}.banner .big{display:none}.banner .nav{position:static;margin-top:10px}
  .act{grid-template-columns:1fr}.act .thumb{min-height:140px;place-items:center}.act .thumb .play{position:relative;z-index:1}.act h3{font-size:19px}.banner h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="https://edubull.com"><span class="mark">eb</span><span><small>Edubull</small>Science Activity</span></a>
  <span class="chip"><span class="ms">science</span>Class 8</span>
  <span class="spacer"></span>
  <label class="search" id="searchBox"><span class="ms">search</span><input id="searchInput" type="search" placeholder="Search activities…" autocomplete="off" aria-label="Search"><button class="clear" id="searchClear" type="button" aria-label="Clear search"><span class="ms" style="--is:18px">close</span></button></label>
</header>

<div class="layout">
  <aside class="notebook" aria-label="Chapters">
    <div class="nh"><h2>Chapters</h2><span id="chMeta"></span></div>
    <div class="chapters" id="chapters"></div>
  </aside>
  <main class="stage" id="stage"></main>
</div>
<footer>Powered by <b>Edubull Technologies</b> · Class 8 Science Activity</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box" id="mBox">
    <div class="head"><span class="tag" id="mTag"></span><h3 id="mTitle"></h3>
      <a class="btn" id="mOpen" href="#" target="_blank" rel="noopener" title="Open in new tab"><span class="ms">open_in_new</span></a>
      <button class="btn" id="mClose" aria-label="Close"><span class="ms">close</span></button></div>
    <video id="mVideo" controls playsinline preload="metadata" controlsList="nodownload"></video>
    <div class="foot"><span id="mSub"></span><div class="nav"><button class="btn" id="mPrev"><span class="ms">skip_previous</span>Previous</button><button class="btn" id="mNext">Next<span class="ms">skip_next</span></button></div></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   DATA — Class 8 Science activities. Edit here to add or change links.
   `file` is the video filename under BASE. Leave empty if not ready.
   ===================================================================== */
const BASE = 'https://edubullmedia01.blob.core.windows.net/edubull/activity/class8-science/';
const UNITS = [
  { n:1,  name:'Exploring the Investigative World of Science', icon:'travel_explore', color:'#5b5bd6', topics:[
      { t:'The Nature of Scientific Inquiry', file:'8Sci-Ch1-Act1.mp4' },
      { t:'The Process of Scientific Investigation', file:'8Sci-Ch1-Act2.mp4' },
      { t:'The Interconnectedness of Science', file:'8Sci-Ch1-Act3.mp4' } ] },
  { n:2,  name:'The Invisible Living World', icon:'microbiology', color:'#10b981', topics:[
      { t:'Observing Plant and Animal Cells', file:'' },
      { t:'Concept Mapping the Levels of Organisation', file:'' },
      { t:'Observing the Microbial Menagerie', file:'' },
      { t:'Beneficial Microorganisms', file:'8Sci-Ch2-Act4.mp4' } ] },
  { n:3,  name:'Health: The Ultimate Treasure', icon:'health_and_safety', color:'#f0567d', topics:[
      { t:'Our Body – Defense and Modern Medicine', file:'8Sci-Ch3-Act3.mp4' } ] },
  { n:4,  name:'Electricity: Magnetic and Heating Effects', icon:'bolt', color:'#f59e0b', topics:[
      { t:'Magnetic Effect of Electric Current', file:'8Sci-Ch4-Act1.mp4' },
      { t:'Heating Effect of Electric Current', file:'8Sci-Ch4-Act2.mp4' },
      { t:'How a Battery Generates Electricity', file:'8Sci-Ch4-Act3.mp4' } ] },
  { n:5,  name:'Exploring Forces', icon:'fitness_center', color:'#0ea5e9', topics:[
      { t:'Forces In Action', file:'8Sci-Ch5-Act1.mp4' },
      { t:'Pressure And Buoyancy', file:'8Sci-Ch5-Act2.mp4' } ] },
  { n:6,  name:'Pressure, Winds, Storms, and Cyclones', icon:'cyclone', color:'#6366f1', topics:[
      { t:'Understanding Pressure in Solids, Liquids, and Gases', file:'8Sci-Ch6-Act1.mp4' },
      { t:'Extreme Weather – Thunder, Lightning, and Cyclones', file:'8Sci-Ch6-Act2.mp4' } ] },
  { n:7,  name:'Matter: The World of Tiny Particles', icon:'grain', color:'#8b5cf6', topics:[
      { t:'Building Blocks Of Matter', file:'8Sci-Ch7-Act1.mp4' },
      { t:'Behavior Of Matter', file:'8Sci-Ch7-Act2.mp4' } ] },
  { n:8,  name:'Nature of Matter: Elements, Compounds, and Mixtures', icon:'science', color:'#0ea5a4', topics:[
      { t:'Understanding Pure Substances and Mixtures', file:'8Sci-Ch8-Act1.mp4' },
      { t:'Differentiating Mixtures and Compounds', file:'8Sci-Ch8-Act2.mp4' } ] },
  { n:9,  name:'World of Solutes, Solvents, and Solutions', icon:'water_drop', color:'#3b82f6', topics:[
      { t:'Mixtures and Solutions', file:'8Sci-Ch9-Act1.mp4' },
      { t:'Density and Buoyancy', file:'8Sci-Ch9-Act2.mp4' } ] },
  { n:10, name:'The Magic of Light: Mirrors and Lenses', icon:'flare', color:'#f97316', topics:[
      { t:'Exploring Reflection with Mirrors', file:'' },
      { t:'Finding the Focal Length of a Convex Lens', file:'' } ] },
  { n:11, name:'Keeping Time with the Skies', icon:'dark_mode', color:'#7c3aed', topics:[
      { t:'Understanding the Moon and Artificial Satellites', file:'' },
      { t:'The Drifting Lunar Calendar', file:'' } ] },
  { n:12, name:'How Nature Works in Harmony', icon:'eco', color:'#22c55e', topics:[
      { t:'Interaction Charades', file:'' },
      { t:'Mini Ecosystem in a Jar', file:'' } ] },
  { n:13, name:'Our Home: Earth, a Unique Life-Sustaining Planet', icon:'public', color:'#ec4899', topics:[
      { t:'Create a Terrarium (Ecosystem in a Jar)', file:'' },
      { t:'The Melting Ice and Rising Seas', file:'' } ] },
];

/* ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=f=>f?BASE+f:'';
const state={unit:UNITS[0].n,query:''};
const unitByN=n=>UNITS.find(u=>u.n===n);
const allTopics=UNITS.flatMap(u=>u.topics.map((t,i)=>({...t,unit:u,i})));
const withVideo=allTopics.filter(t=>t.file);
const vids=u=>u.topics.filter(t=>t.file).length;

/* ---------- Chapters ---------- */
function renderChapters(){
  $('#chMeta').textContent=`${UNITS.length} chapters`;
  $('#chapters').innerHTML=UNITS.map(u=>`<button class="ch ${u.n===state.unit&&!state.query?'active':''} ${vids(u)?'':'soon'}" style="--c:${u.color}" data-unit="${u.n}">
    <span class="tab">${u.n}</span><span><div class="t">${esc(u.name)}</div><div class="m">${vids(u)?`${vids(u)} video${vids(u)===1?'':'s'}`:'Videos coming soon'}</div></span><span class="badge">${u.topics.length}</span></button>`).join('');
}
$('#chapters').onclick=e=>{const b=e.target.closest('[data-unit]');if(b)go(+b.dataset.unit);};

/* ---------- Activities ---------- */
function actCard(u,t,i,showUnit=false){
  const has=!!t.file;
  return `<article class="act ${has?'':'soon'}" style="--c:${u.color};--i:${i}">
    <div class="thumb"><span class="no">Activity ${i+1}</span><span class="play"><span class="ms fill">${has?'play_arrow':'schedule'}</span></span></div>
    <div class="body"><h3>${esc(t.t)}</h3><p>${showUnit?`Chapter ${u.n} · ${esc(u.name)}`:(has?'Watch the activity video and try it yourself.':'This activity video is being prepared.')}</p>
      <div class="row">${has?`<button class="btn go" data-play="${u.n}:${i}"><span class="ms fill">play_circle</span>Play video</button><a class="btn" href="${esc(url(t.file))}" target="_blank" rel="noopener"><span class="ms">open_in_new</span>New tab</a>`:`<span class="btn go"><span class="ms">schedule</span>Coming soon</span>`}</div></div>
  </article>`;
}
function renderStage(){
  const u=unitByN(state.unit);const idx=UNITS.indexOf(u),prev=UNITS[idx-1],next=UNITS[idx+1];
  $('#stage').innerHTML=`<div class="banner" style="--c:${u.color}">
      <div><div class="lv">Chapter ${u.n} · Class 8 Science</div><h1>${esc(u.name)}</h1>
        <div class="meta"><span><span class="ms">experiment</span>${u.topics.length} activit${u.topics.length===1?'y':'ies'}</span><span><span class="ms">play_circle</span>${vids(u)} video${vids(u)===1?'':'s'}</span></div></div>
      <div class="big"><span class="ms fill">${u.icon}</span></div>
      <div class="nav"><button id="prevU" ${prev?'':'disabled'} aria-label="Previous chapter"><span class="ms">chevron_left</span></button><button id="nextU" ${next?'':'disabled'} aria-label="Next chapter"><span class="ms">chevron_right</span></button></div>
    </div><div class="acts">${u.topics.map((t,i)=>actCard(u,t,i)).join('')}</div>`;
  $('#prevU').onclick=()=>prev&&go(prev.n);$('#nextU').onclick=()=>next&&go(next.n);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(!b)return;const [n,i]=b.dataset.play.split(':').map(Number);openVideo(n,i);});

/* ---------- Search ---------- */
function renderSearch(){
  const q=state.query.trim().toLowerCase();
  const hits=allTopics.filter(t=>(t.t+' '+t.unit.name).toLowerCase().includes(q));
  const units=[...new Set(hits.map(h=>h.unit))];
  $('#stage').innerHTML=`<div class="group"><div class="gh"><span class="n"><span class="ms" style="--is:18px">search</span></span>${hits.length} result${hits.length===1?'':'s'} for “${esc(state.query.trim())}”</div></div>`+
    (hits.length?units.map(u=>`<div class="group" style="--c:${u.color}"><div class="gh"><span class="n">${u.n}</span>${esc(u.name)}</div><div class="acts">${hits.filter(h=>h.unit===u).map(h=>actCard(u,h,h.i)).join('')}</div></div>`).join('')
    :`<div class="empty"><span class="ms fill">search_off</span><b>No activities found</b>Try “forces”, “matter” or “light”.</div>`);
}
const searchInput=$('#searchInput'),searchBox=$('#searchBox');let st;
searchInput.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>{state.query=searchInput.value;searchBox.classList.toggle('has',!!state.query);render();},120);});
function clearSearch(){searchInput.value='';state.query='';searchBox.classList.remove('has');}
$('#searchClear').onclick=()=>{clearSearch();render();searchInput.focus();};

/* ---------- Routing ---------- */
function render(){renderChapters();state.query.trim()?renderSearch():renderStage();const u=unitByN(state.unit);document.title=`Chapter ${u.n} · Class 8 Science Activity · Edubull`;}
function go(n){state.unit=n;clearSearch();location.hash=`#/chapter/${n}`;render();if(innerWidth<980)$('#stage').scrollIntoView({behavior:'smooth',block:'start'});}
function route(){const m=location.hash.match(/^#\/chapter\/(\d+)/);if(m&&unitByN(+m[1]))state.unit=+m[1];render();}
window.addEventListener('hashchange',route);

/* ---------- Player ---------- */
const modal=$('#modal'),video=$('#mVideo');
function openVideo(n,i){
  const u=unitByN(n),t=u.topics[i];if(!t||!t.file)return;
  $('#mBox').style.setProperty('--c',u.color);$('#mTag').textContent=`Chapter ${u.n} · Activity ${i+1}`;$('#mTitle').textContent=t.t;$('#mSub').textContent=u.name;$('#mOpen').href=url(t.file);
  video.src=url(t.file);modal.classList.add('open');document.body.style.overflow='hidden';video.play().catch(()=>{});
  const k=withVideo.findIndex(x=>x.unit.n===n&&x.i===i);
  $('#mPrev').disabled=k<=0;$('#mNext').disabled=k>=withVideo.length-1;
  $('#mPrev').onclick=()=>{const p=withVideo[k-1];p&&openVideo(p.unit.n,p.i);};$('#mNext').onclick=()=>{const p=withVideo[k+1];p&&openVideo(p.unit.n,p.i);};
}
function closeVideo(){modal.classList.remove('open');document.body.style.overflow='';video.pause();video.removeAttribute('src');video.load();}
video.addEventListener('ended',()=>{if(!$('#mNext').disabled)setTimeout(()=>$('#mNext').click(),800);});
video.addEventListener('error',()=>toast('Video could not load. Try “New tab”.'));
$('#mClose').onclick=closeVideo;modal.addEventListener('click',e=>{if(e.target===modal)closeVideo();});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
document.addEventListener('keydown',e=>{
  const typing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(e.key==='/'&&!typing&&!modal.classList.contains('open')){e.preventDefault();searchInput.focus();}
  if(e.key==='Escape'){if(modal.classList.contains('open'))closeVideo();else if(typing&&searchInput.value){clearSearch();render();searchInput.blur();}}
  if(modal.classList.contains('open')&&!typing){if(e.key==='ArrowRight')$('#mNext').click();if(e.key==='ArrowLeft')$('#mPrev').click();}
});
route();
</script>
</body>
</html>
