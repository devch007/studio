<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 8 Science Activities · Edubull</title>
<meta name="description" content="Class 8 Science activity videos by Edubull — explore every unit, pick a topic and watch the activity.">
<meta name="theme-color" content="#eceefa">
<meta name="color-scheme" content="light only">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230ea5e9'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3Eeb%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
<style>
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#eceefa;--surface:rgba(255,255,255,.72);--surface-solid:#fff;--surface-2:rgba(255,255,255,.55);
  --border:rgba(14,165,233,.12);--border-strong:rgba(14,165,233,.25);
  --text:#141633;--text-2:#4a4d6b;--text-3:#80839c;
  --brand:#0ea5e9;--brand-2:#5b5bd6;--accent:#f0567d;--ok:#10b981;
  --brand-soft:rgba(14,165,233,.12);--brand-soft-2:rgba(14,165,233,.22);--ring:rgba(14,165,233,.35);
  --shadow-sm:0 1px 2px rgba(20,22,51,.05),0 2px 8px rgba(20,22,51,.04);
  --shadow-md:0 4px 16px rgba(20,22,51,.07),0 12px 32px rgba(14,165,233,.10);
  --shadow-lg:0 24px 64px rgba(40,44,110,.14),0 4px 16px rgba(20,22,51,.06);
  --r-xl:30px;--r-lg:22px;--r-md:16px;--r-sm:12px;--ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1100px 600px at 5% -10%,#dcecfb,transparent 60%),
  radial-gradient(900px 600px at 100% 0%,#efe4f8,transparent 60%),
  radial-gradient(900px 700px at 60% 110%,#e3f5f0,transparent 60%),var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:12px}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-size:var(--is,24px);line-height:1;display:inline-block;white-space:nowrap;letter-spacing:normal;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;user-select:none;vertical-align:middle}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 32px;background:linear-gradient(var(--bg) 60%,transparent)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#5b5bd6,#f0567d);font-size:14px;box-shadow:0 6px 16px rgba(91,91,214,.35)}
.brand small{display:block;font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);line-height:1}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-3);margin-left:8px}
.crumb button{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;color:var(--text-3);transition:all .2s}
.crumb button:hover{color:var(--brand);background:var(--brand-soft)}
.crumb .cur{color:var(--text);padding:5px 9px;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .ms{--is:15px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;width:min(360px,100%);height:46px;padding:0 14px;border-radius:15px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(16px);box-shadow:var(--shadow-sm);transition:all .25s var(--ease)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft-2),var(--shadow-md);background:var(--surface-solid)}
.search .ms{--is:20px;color:var(--text-3)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;color:var(--text);outline:none}
.search input::placeholder{color:var(--text-3)}
.search kbd{font-family:inherit;font-size:11px;font-weight:700;color:var(--text-3);padding:3px 7px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface-2)}
.search .clear{display:none;width:24px;height:24px;border-radius:8px;place-items:center;color:var(--text-3)}
.search.has .clear{display:grid}.search.has kbd{display:none}

.wrap{max-width:1240px;margin:0 auto;padding:6px 32px 64px}
.view{display:none;animation:fade .45s var(--ease)}.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Hero / dashboard ---------- */

.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:10px 0 16px}
.section-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.section-head h2 .ms{--is:20px;width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--brand-soft);color:var(--brand)}
.section-head .meta{font-size:12.5px;font-weight:700;color:var(--text-3)}

/* ---------- Unit cards ---------- */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.unit{--c:var(--brand);position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r-lg);text-align:left;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;animation:fade .5s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
.unit::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 140px at 100% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.unit:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.unit:hover::before{opacity:1}
.unit .top-row{display:flex;align-items:center;justify-content:space-between}
.unit .num{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.5px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:0 10px 20px color-mix(in srgb,var(--c) 38%,transparent)}
.unit .num .ms{--is:24px}
.unit .pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 10px 5px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
.unit .pill .ms{--is:13px}
.unit .pill.none{background:var(--surface-2);color:var(--text-3)}
.unit h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25;min-height:42px}
.unit .sub{font-size:12.5px;color:var(--text-3);font-weight:600}
.unit .go{display:flex;align-items:center;justify-content:space-between;margin-top:auto;font-size:13px;font-weight:700;color:var(--c)}
.unit .go .arrow{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--surface-solid);box-shadow:var(--shadow-sm);transition:all .3s var(--ease)}
.unit .go .arrow .ms{--is:18px}
.unit:hover .go .arrow{transform:translateX(4px);background:var(--c);color:#fff}

/* ---------- Unit detail ---------- */
.detail-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:20px}
.back{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);color:var(--text-2);transition:all .25s var(--ease)}
.back .ms{--is:22px}
.back:hover{background:var(--brand);color:#fff;transform:translateX(-3px)}
.detail-head .k{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--c,var(--brand))}
.detail-head h1{margin:2px 0 4px;font-size:clamp(22px,2.8vw,34px);font-weight:800;letter-spacing:-1px;line-height:1.1}
.detail-head p{margin:0;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.detail-head p .ms{--is:16px;color:var(--c,var(--brand))}
.unit-nav{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.unit-nav button{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:13px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text-2);transition:all .2s var(--ease)}
.unit-nav button:hover:not(:disabled){background:var(--surface-solid);color:var(--brand);box-shadow:var(--shadow-sm)}
.unit-nav button:disabled{opacity:.35;cursor:not-allowed}
.unit-nav .ms{--is:18px}

.topics{display:grid;gap:12px}
.topic{--c:var(--brand);display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all .25s var(--ease);animation:fade .45s var(--ease) both;animation-delay:calc(var(--i)*45ms)}
.topic:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.topic .idx{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.topic .idx .ms{--is:22px}
.topic h4{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.3}
.topic .file{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);font-weight:600;margin-top:3px}
.topic .file .ms{--is:14px}
.topic .file code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--surface-2);padding:2px 6px;border-radius:6px;border:1px solid var(--border)}
.topic .actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:800;background:var(--surface-solid);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all .25s var(--ease);white-space:nowrap}
.btn .ms{--is:18px}
.btn.primary{background:var(--c,var(--brand));color:#fff;border-color:transparent;box-shadow:0 8px 18px color-mix(in srgb,var(--c,var(--brand)) 35%,transparent)}
.btn.primary:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn.ghost:hover{background:var(--brand-soft);color:var(--brand)}
.btn.icon{width:40px;padding:0;justify-content:center}
.btn.soon{background:var(--surface-2);color:var(--text-3);box-shadow:none;cursor:default}
.topic.soon{opacity:.75}
.topic.soon h4{color:var(--text-2)}

/* ---------- Search results ---------- */
.result-group{margin-bottom:22px}
.result-group .gh{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13.5px;font-weight:800;color:var(--text-2)}
.result-group .gh .num{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:12px;background:var(--c,var(--brand))}
.empty{display:grid;place-items:center;text-align:center;padding:60px 20px;border-radius:var(--r-lg);border:1.5px dashed var(--border-strong);color:var(--text-2)}
.empty .ms{--is:56px;color:var(--brand);margin-bottom:8px}
.empty b{display:block;font-size:17px;color:var(--text);margin-bottom:2px}

/* ---------- Video modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(10,12,40,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.modal .box{width:min(1000px,100%);background:var(--surface-solid);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);transform:translateY(16px) scale(.98);transition:transform .3s var(--ease)}
.modal.open .box{transform:none}
.modal .head{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px}
.modal .head .tag{--c:var(--brand);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--c);padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.modal .head h3{margin:0;font-size:16px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .head .btn{height:36px}
.modal video{display:block;width:100%;aspect-ratio:16/9;background:#000;outline:none}
.modal .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;font-size:12.5px;color:var(--text-3);flex-wrap:wrap}
.modal .foot .nav{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;z-index:60;padding:11px 16px;border-radius:13px;background:var(--text);color:#fff;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);transition:all .3s var(--ease);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

footer{padding:24px 32px;text-align:center;color:var(--text-3);font-size:12.5px}
footer b{color:var(--text-2)}

@media (max-width:980px){@media (max-width:720px){
  .top{padding:12px 16px;flex-wrap:wrap}.crumb{display:none}.search{margin-left:0;flex:1;width:auto}.search kbd{display:none}
  .wrap{padding:4px 16px 48px}  .units{grid-template-columns:1fr 1fr;gap:12px}.unit{padding:14px}.unit h3{font-size:14.5px;min-height:0}.unit .sub{display:none}
  .topic{grid-template-columns:auto 1fr;padding:12px}.topic .actions{grid-column:1/-1;justify-content:stretch}.topic .actions .btn{flex:1;justify-content:center}.topic .file:has(code){display:none}
  .modal{padding:10px}.modal .box{border-radius:18px}
}
@media (max-width:420px){.units{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="https://edubull.com"><span class="mark">eb</span><span><small>Edubull</small>Science Activities</span></a>
  <div class="crumb" id="crumb"></div>
  <label class="search" id="searchBox">
    <span class="ms">search</span>
    <input id="searchInput" type="search" placeholder="Search units or activities…" autocomplete="off" aria-label="Search activities">
    <kbd>/</kbd>
    <button class="clear" id="searchClear" type="button" aria-label="Clear search"><span class="ms" style="--is:16px">close</span></button>
  </label>
</header>

<main class="wrap">
  <!-- ===== Dashboard ===== -->
  <section class="view active" id="viewHome" aria-label="Dashboard">
    <div class="section-head"><h2><span class="ms">view_module</span>Units</h2><div class="meta" id="unitMeta"></div></div>
    <div class="units" id="units"></div>
  </section>

  <!-- ===== Unit detail ===== -->
  <section class="view" id="viewUnit" aria-label="Unit activities">
    <div class="detail-head" id="detailHead">
      <button class="back" id="backBtn" aria-label="Back to all units"><span class="ms">arrow_back</span></button>
      <div><div class="k" id="dK"></div><h1 id="dName"></h1><p id="dSub"></p></div>
    </div>
    <div class="unit-nav">
      <button id="prevUnit"><span class="ms">chevron_left</span><span id="prevLbl">Previous</span></button>
      <button id="nextUnit"><span id="nextLbl">Next</span><span class="ms">chevron_right</span></button>
    </div>
    <div class="topics" id="topics"></div>
  </section>

  <!-- ===== Search ===== -->
  <section class="view" id="viewSearch" aria-label="Search results">
    <div class="section-head"><h2><span class="ms">search</span>Results</h2><div class="meta" id="searchMeta"></div></div>
    <div id="searchResults"></div>
  </section>
</main>

<footer>Powered by <b>Edubull Technologies</b> · Class 8 Science activity library</footer>

<!-- ===== Video modal ===== -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <div class="head">
      <span class="tag" id="mTag"></span>
      <h3 id="mTitle"></h3>
      <a class="btn ghost icon" id="mOpen" href="#" target="_blank" rel="noopener" title="Open in new tab"><span class="ms">open_in_new</span></a>
      <button class="btn ghost icon" id="mClose" aria-label="Close"><span class="ms">close</span></button>
    </div>
    <video id="mVideo" controls playsinline preload="metadata" controlsList="nodownload"></video>
    <div class="foot">
      <span id="mFile"></span>
      <div class="nav">
        <button class="btn ghost" id="mPrev"><span class="ms">skip_previous</span>Previous</button>
        <button class="btn ghost" id="mNext">Next<span class="ms">skip_next</span></button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   DATA — Class 8 Science activities. Edit here to add or change links.
   `file` is the video filename under BASE. Leave file empty for topics
   whose video is not ready yet.
   ===================================================================== */
const BASE = 'https://edubullmedia01.blob.core.windows.net/edubull/activity/class8-science/';
const UNITS = [
  { n:1,  name:'Exploring the Investigative World of Science', icon:'travel_explore', color:'#5b5bd6', topics:[
      { t:'The Nature of Scientific Inquiry', file:'8Sci-Ch1-Act1.mp4' },

      { t:'Beneficial Microorganisms', file:'8Sci-Ch2-Act4.mp4' } ] },
  { n:3,  name:'Health: The Ultimate Treasure', icon:'health_and_safety', color:'#f0567d', topics:[
      { t:'Our Body – Defense and Modern Medicine', file:'8Sci-Ch3-Act3.mp4' } ] },
  { n:4,  name:'Electricity: Magnetic and Heating Effects', icon:'bolt', color:'#f59e0b', topics:[
      { t:'Magnetic Effect of Electric Current', file:'8Sci-Ch4-Act1.mp4' },
      { t:'Heating Effect of Electric Current', file:'8Sci-Ch4-Act2.mp4' },
      { t:'How a Battery Generates Electricity', file:'8Sci-Ch4-Act3.mp4' } ] },
  { n:5,  name:'Exploring Forces', icon:'fitness_center', color:'#0ea5e9', topics:[
      { t:'Forces In Action', file:'8Sci-Ch5-Act1.mp4' },
      { t:'Pressure And Buoyancy', file:'8Sci-Ch5-Act2.mp4' } ] },
  { n:6,  name:'Pressure, Winds, Storms, and Cyclones', icon:'cyclone', color:'#6366f1', topics:[
      { t:'Understanding Pressure in Solids, Liquids, and Gases', file:'8Sci-Ch6-Act1.mp4' },
      { t:'Extreme Weather – Thunder, Lightning, and Cyclones', file:'8Sci-Ch6-Act2.mp4' } ] },
  { n:7,  name:'Matter: The World of Tiny Particles', icon:'grain', color:'#8b5cf6', topics:[
      { t:'Building Blocks Of Matter', file:'8Sci-Ch7-Act1.mp4' },
      { t:'Behavior Of Matter', file:'8Sci-Ch7-Act2.mp4' } ] },
  { n:8,  name:'Nature of Matter: Elements, Compounds, and Mixtures', icon:'science', color:'#0ea5a4', topics:[
      { t:'Understanding Pure Substances and Mixtures', file:'8Sci-Ch8-Act1.mp4' },
      { t:'Differentiating Mixtures and Compounds', file:'8Sci-Ch8-Act2.mp4' } ] },
  { n:9,  name:'World of Solutes, Solvents, and Solutions', icon:'water_drop', color:'#3b82f6', topics:[
      { t:'Mixtures and Solutions', file:'8Sci-Ch9-Act1.mp4' },
      { t:'Density and Buoyancy', file:'8Sci-Ch9-Act2.mp4' } ] },
  { n:10, name:'The Magic of Light: Mirrors and Lenses', icon:'flare', color:'#f97316', topics:[
      { t:'Exploring Reflection with Mirrors', file:'' },
      { t:'Finding the Focal Length of a Convex Lens', file:'' } ] },
  { n:11, name:'Keeping Time with the Skies', icon:'dark_mode', color:'#7c3aed', topics:[
      { t:'Understanding the Moon and Artificial Satellites', file:'' },
      { t:'The Drifting Lunar Calendar', file:'' } ] },
  { n:12, name:'How Nature Works in Harmony', icon:'eco', color:'#22c55e', topics:[
      { t:'Interaction Charades', file:'' },
      { t:'Mini Ecosystem in a Jar', file:'' } ] },
  { n:13, name:'Our Home: Earth, a Unique Life-Sustaining Planet', icon:'public', color:'#ec4899', topics:[
      { t:'Create a Terrarium (Ecosystem in a Jar)', file:'' },
      { t:'The Melting Ice and Rising Seas', file:'' } ] },
];

/* ===================================================================== */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url = f=>f?BASE+f:'';
const state = { view:'home', unit:null, query:'' };
const unitByN = n=>UNITS.find(u=>u.n===n);
const allTopics = UNITS.flatMap(u=>u.topics.map((t,i)=>({...t,unit:u,i})));
const withVideo = allTopics.filter(t=>t.file);

/* ---------- Stats ---------- */
$('#unitMeta').textContent=`${UNITS.length} units · ${allTopics.length} activities`;

/* ---------- Unit cards ---------- */
function unitCard(u,i){
  const v=u.topics.filter(t=>t.file).length;
  return `<button class="unit" style="--c:${u.color};--i:${i}" data-unit="${u.n}" aria-label="Open unit ${u.n}">
    <div class="top-row"><span class="num"><span class="ms fill">${u.icon}</span></span>
      <span class="pill ${v?'':'none'}"><span class="ms">${v?'play_circle':'schedule'}</span>${v?`${v} video${v===1?'':'s'}`:'Coming soon'}</span></div>
    <h3>${esc(u.name)}</h3>
    <div class="sub">Unit ${u.n} · ${u.topics.length} activit${u.topics.length===1?'y':'ies'}</div>
    <div class="go"><span>View activities</span><span class="arrow"><span class="ms">arrow_forward</span></span></div>
  </button>`;
}
$('#units').innerHTML=UNITS.map(unitCard).join('');
$('#units').onclick=e=>{const b=e.target.closest('[data-unit]');if(b)go('unit',+b.dataset.unit);};

/* ---------- Topic rows ---------- */
function topicRow(u,t,i,showUnit=false){
  const has=!!t.file;
  return `<div class="topic ${has?'':'soon'}" style="--c:${u.color};--i:${i}">
    <span class="idx">${has?`<span class="ms fill">play_arrow</span>`:`<span class="ms">hourglass_top</span>`}</span>
    <div><h4>${esc(t.t)}</h4>
      <div class="file">${showUnit?`<span class="ms">menu_book</span>Unit ${u.n} · ${esc(u.name)}`:(has?`<span class="ms">movie</span><code>${esc(t.file)}</code>`:`<span class="ms">schedule</span>Video coming soon`)}</div></div>
    <div class="actions">${has
      ?`<button class="btn primary" data-play="${u.n}:${i}"><span class="ms fill">play_circle</span>Watch video</button>
        <a class="btn ghost icon" href="${esc(url(t.file))}" target="_blank" rel="noopener" title="Open in new tab"><span class="ms">open_in_new</span></a>`
      :`<span class="btn soon"><span class="ms">schedule</span>Coming soon</span>`}</div>
  </div>`;
}
function renderUnit(){
  const u=unitByN(state.unit); if(!u) return go('home');
  const v=u.topics.filter(t=>t.file).length;
  $('#detailHead').style.setProperty('--c',u.color);
  $('#dK').textContent=`Unit ${u.n} · Class 8 Science`;
  $('#dName').textContent=u.name;
  $('#dSub').innerHTML=`<span class="ms">experiment</span>${u.topics.length} activit${u.topics.length===1?'y':'ies'} <span class="ms">play_circle</span>${v} video${v===1?'':'s'} ready`;
  const idx=UNITS.indexOf(u),prev=UNITS[idx-1],next=UNITS[idx+1];
  $('#prevUnit').disabled=!prev;$('#nextUnit').disabled=!next;
  $('#prevLbl').textContent=prev?`Unit ${prev.n}`:'Previous';$('#nextLbl').textContent=next?`Unit ${next.n}`:'Next';
  $('#prevUnit').onclick=()=>prev&&go('unit',prev.n);$('#nextUnit').onclick=()=>next&&go('unit',next.n);
  $('#topics').innerHTML=u.topics.map((t,i)=>topicRow(u,t,i)).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(!b)return;const [n,i]=b.dataset.play.split(':').map(Number);openVideo(n,i);});

/* ---------- Search ---------- */
function renderSearch(){
  const q=state.query.trim().toLowerCase();
  const hits=allTopics.filter(t=>(t.t+' '+t.unit.name+' '+t.file).toLowerCase().includes(q));
  const units=[...new Set(hits.map(h=>h.unit))];
  $('#searchMeta').textContent=`${hits.length} activit${hits.length===1?'y':'ies'} in ${units.length} unit${units.length===1?'':'s'}`;
  $('#searchResults').innerHTML=hits.length?units.map(u=>`<div class="result-group" style="--c:${u.color}"><div class="gh"><span class="num">${u.n}</span>${esc(u.name)}</div><div class="topics">${hits.filter(h=>h.unit===u).map((h,i)=>topicRow(u,h,h.i)).join('')}</div></div>`).join('')
    :`<div class="empty"><span class="ms">search_off</span><b>Nothing found</b>Try “forces”, “matter” or “light”.</div>`;
}
const searchInput=$('#searchInput'),searchBox=$('#searchBox');let st;
searchInput.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>{state.query=searchInput.value;searchBox.classList.toggle('has',!!state.query);state.query.trim()?show('search'):show(state.unit?'unit':'home');},120);});
function clearSearch(){searchInput.value='';state.query='';searchBox.classList.remove('has');}
$('#searchClear').onclick=()=>{clearSearch();show(state.unit?'unit':'home');searchInput.focus();};

/* ---------- Routing ---------- */
function go(view,n){state.view=view;if(view==='unit')state.unit=n;clearSearch();location.hash=view==='unit'?`#/unit/${n}`:'#/';show(view);window.scrollTo({top:0,behavior:'smooth'});}
function show(view){
  state.view=view;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#view'+view[0].toUpperCase()+view.slice(1)).classList.add('active');
  if(view==='unit')renderUnit();else if(view==='search')renderSearch();
  const u=unitByN(state.unit);
  $('#crumb').innerHTML=view==='unit'&&u?`<button data-home><span class="ms">home</span>All units</button><span>›</span><span class="cur">Unit ${u.n}: ${esc(u.name)}</span>`:view==='search'?`<span class="cur">Search</span>`:`<span class="cur">All units</span>`;
  $('#crumb').onclick=e=>e.target.closest('[data-home]')&&go('home');
  document.title=(view==='unit'&&u?`Unit ${u.n} · `:'')+'Class 8 Science Activities · Edubull';
}
function route(){const m=location.hash.match(/^#\/unit\/(\d+)/);if(m&&unitByN(+m[1])){state.unit=+m[1];show('unit');}else show('home');}
window.addEventListener('hashchange',route);$('#backBtn').onclick=()=>go('home');

/* ---------- Video modal ---------- */
const modal=$('#modal'),video=$('#mVideo');let current=null;
function openVideo(n,i){
  const u=unitByN(n),t=u.topics[i];if(!t||!t.file)return;
  current={n,i};
  $('#mTag').style.setProperty('--c',u.color);$('#mTag').textContent=`Unit ${u.n}`;
  $('#mTitle').textContent=t.t;$('#mFile').textContent=t.file;$('#mOpen').href=url(t.file);
  video.src=url(t.file);modal.classList.add('open');document.body.style.overflow='hidden';
  video.play().catch(()=>{});
  const list=withVideo,k=list.findIndex(x=>x.unit.n===n&&x.i===i);
  $('#mPrev').disabled=k<=0;$('#mNext').disabled=k>=list.length-1;
  $('#mPrev').onclick=()=>{const p=list[k-1];p&&openVideo(p.unit.n,p.i);};
  $('#mNext').onclick=()=>{const p=list[k+1];p&&openVideo(p.unit.n,p.i);};
}
function closeVideo(){modal.classList.remove('open');document.body.style.overflow='';video.pause();video.removeAttribute('src');video.load();current=null;}
$('#mClose').onclick=closeVideo;modal.addEventListener('click',e=>{if(e.target===modal)closeVideo();});
video.addEventListener('ended',()=>{if(!$('#mNext').disabled){toast('Playing next activity');$('#mNext').click();}});
video.addEventListener('error',()=>toast('Video could not be loaded. Try “Open in new tab”.'));

/* ---------- Keyboard & toast ---------- */
document.addEventListener('keydown',e=>{
  const typing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(e.key==='/'&&!typing&&!modal.classList.contains('open')){e.preventDefault();searchInput.focus();}
  if(e.key==='Escape'){if(modal.classList.contains('open'))closeVideo();else if(typing&&searchInput.value){clearSearch();show(state.unit?'unit':'home');searchInput.blur();}else if(state.view==='unit')go('home');}
  if(modal.classList.contains('open')&&!typing){if(e.key==='ArrowRight')$('#mNext').click();if(e.key==='ArrowLeft')$('#mPrev').click();}
});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000);}

route();
</script>
</body>
</html>
